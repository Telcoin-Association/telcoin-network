[package]
name = "tn-reth"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
authors = [
    "Grant Kee <grant@telcoin.org>",
    "Steven Stanfield <steve@telcoin.org>",
    "Markus Osterlund <markus@telcoin.org>",
]
publish = false

[dependencies]
# `server` + `macros` back the TN eth-method overrides (`rpc_fee_history` and the
# `--rpc.txfeecap` guard's `rpc_fee_cap`).
jsonrpsee = { workspace = true, features = ["server", "macros"] }
async-trait = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
tn-config = { workspace = true }
tn-types = { workspace = true }
tn-worker = { workspace = true }
tn-storage = { workspace = true }
dirs-next = "2.0.0"
parking_lot = { workspace = true }

# TN takes reth's individual crates, not the `reth` umbrella crate (see the root
# `Cargo.toml`). The umbrella's default features are enabled here on the crates it forwarded
# them to: jemalloc (reth-cli-util, reth-node-core; not reth-node-metrics, whose jemalloc
# stats feed only reth's own metrics server, which TN never starts); otlp and otlp-logs
# (reth-node-core); js-tracer (reth-node-builder, reth-node-ethereum, reth-rpc,
# reth-rpc-eth-types); keccak-cache-global (reth-node-core, reth-node-ethereum); asm-keccak
# (reth-node-core, reth-node-ethereum, reth-primitives); min-debug-logs (reth-node-core, which
# caps `tracing` at debug in release builds).
reth-db = { workspace = true }
reth-db-common = { workspace = true }
reth-node-core = { workspace = true, features = [
    "jemalloc",
    "otlp",
    "otlp-logs",
    "keccak-cache-global",
    "asm-keccak",
    "min-debug-logs",
] }
reth-node-ethereum = { workspace = true, features = [
    "js-tracer",
    "keccak-cache-global",
    "asm-keccak",
] }
reth-chainspec = { workspace = true }
reth-chain-state = { workspace = true }
reth-cli-util = { workspace = true, features = ["jemalloc"] }
reth-primitives = { workspace = true, features = ["asm-keccak"] }
reth-consensus = { workspace = true }
reth-evm-ethereum = { workspace = true }
reth-engine-primitives = { workspace = true }
reth-revm = { workspace = true }
reth-evm = { workspace = true }
reth-node-builder = { workspace = true, features = ["js-tracer"] }
reth-provider = { workspace = true }
# Direct dependencies only so `rocksdb` reaches their own `rocksdb` features, as the umbrella's
# `rocksdb` did (through reth-cli-commands).
reth-prune = { workspace = true, optional = true }
reth-stages = { workspace = true, optional = true }
reth-prune-types = { workspace = true }
reth-primitives-traits = { workspace = true }
reth-stages-types = { workspace = true }
reth-trie = { workspace = true }
reth-trie-db = { workspace = true }
reth-transaction-pool = { workspace = true }
reth-ethereum-engine-primitives = { workspace = true }

reth-errors = { workspace = true }
reth-rpc = { workspace = true, features = ["js-tracer"] }
reth-rpc-api = { workspace = true }
reth-rpc-builder = { workspace = true }
reth-rpc-eth-api = { workspace = true }
reth-rpc-eth-types = { workspace = true, features = ["js-tracer"] }
reth-network = { workspace = true }
reth-network-peers = { workspace = true }
reth-network-api = { workspace = true }
reth-discv4 = { workspace = true }
reth-eth-wire = { workspace = true }
reth-tasks = { workspace = true }
reth-tokio-util = { workspace = true }
reth-tracing = { workspace = true }
reth-metrics = { workspace = true }

metrics = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
eyre = { workspace = true }
# `json-rpc` exposes the request/response packet types the size-capped forwarder transport
# implements `Service` over (issue #1275).
# `rpc-types-mev` exposes the signed-bundle request and response types used by the epoch-fee adapter.
alloy = { workspace = true, features = ["genesis", "json-rpc", "rpc-types-mev"] }
alloy-evm = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
tokio = { workspace = true, features = ["macros", "time", "sync"] }
# `Service` impl for the size-capped forwarder transport (issue #1275). Only the trait; the
# HTTP client underneath comes through alloy's re-export so the TLS backend stays alloy's.
tower = { workspace = true }
tokio-stream = { workspace = true }
reth-ethereum-primitives = { workspace = true }
secp256k1 = { workspace = true, optional = true }
tndb-b-reth = { workspace = true, optional = true }
# The OS page size, as reth reads it for MDBX's default page size (`default_page_size`).
page_size = "0.6.0"

[dev-dependencies]
metrics-util = { workspace = true }
serde_yaml = { workspace = true }
tn-types = { workspace = true, features = ["test-utils"] }
secp256k1 = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
tn-reth = { workspace = true, features = ["test-utils"] }
# `rt` and `test-util` back the forwarder's bound tests: they drive spawned forwards and run
# them on a paused clock so a two-minute budget costs no wall time. `net` and `io-util` back
# the forwarder's response-size-cap tests: they stand up a loopback HTTP endpoint that
# overfeeds the capped transport (issue #1275).
tokio = { workspace = true, features = [
    "macros",
    "time",
    "sync",
    "rt",
    "test-util",
    "net",
    "io-util",
] }

[features]
default = []
faucet = []
test-utils = ["dep:secp256k1"]
# Expose the production sorted-run accumulator to the allocation benchmark.
bench-internals = []
adiri = ["faucet", "tn-types/adiri"]
# Opt back in to reth's RocksDB storage backend (librocksdb-sys, the RocksDB C++ engine).
# Off by default: storage is MDBX-only today, so `RocksDBProvider` resolves to reth's
# zero-size stub and the 332-translation-unit native compile is skipped entirely.
# Required before any storage-v2 / `StorageSettings` experimentation.
rocksdb = [
    "reth-node-core/rocksdb",
    "reth-provider/rocksdb",
    "reth-db-common/rocksdb",
    "dep:reth-stages",
    "reth-stages/rocksdb",
    "dep:reth-prune",
    "reth-prune/rocksdb",
]
# Run TN's reth execution database on the tndb-b engine (`tndb_b_reth::TndbEnv`) instead of
# MDBX. Off by default. MDBX stays compiled: reth's crates require it. See the README's
# "Database backend" section.
tndb-b = ["dep:tndb-b-reth"]

[[bench]]
name = "output_overlay"
harness = false
required-features = ["bench-internals"]

[lints]
workspace = true
