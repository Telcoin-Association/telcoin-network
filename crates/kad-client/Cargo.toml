[package]
name = "tn-kad-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "Read-only kademlia client that fetches BLS-signed Telcoin Network node records without running a node."

[dependencies]
tn-node-record = { workspace = true }
libp2p = { workspace = true, features = ["kad", "gossipsub", "quic", "tokio", "macros"] }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
futures = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tn-network-libp2p = { workspace = true }
tn-config = { workspace = true, features = ["test-utils"] }
tn-storage = { workspace = true, features = ["test-utils"] }
tn-test-utils = { workspace = true }
tn-types = { workspace = true }
serde = { workspace = true }
eyre = { workspace = true }
rand = { workspace = true }

[lints]
workspace = true
