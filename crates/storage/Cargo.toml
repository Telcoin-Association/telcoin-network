[package]
name = "tn-storage"
version.workspace = true
edition = "2021"
license = "MIT or Apache-2.0"
authors = [
    "Grant Kee <grant@telcoin.org>",
    "Steven Stanfield <steve@telcoin.org>",
    "Mysten Labs <build@mystenlabs.com>",
]
publish = false

[dependencies]
tn-utils.workspace = true
tracing.workspace = true
tn-types = { workspace = true }
eyre = { workspace = true }
ouroboros = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
# For the persist async implemetation. `rt` is needed for `spawn_blocking` (offloading the blocking
# pack writes in `export_bounded_bundle`); declared explicitly rather than relying on workspace
# feature unification so a lib-only `cargo build -p tn-storage` also resolves it.
tokio = { workspace = true, features = [ "sync", "fs", "rt" ] }
crc32fast = "1.5.0"
cfg-if = { workspace = true }
serde = { workspace = true }
# Headers are stored RLP-encoded (their canonical form); the BCS record codec cannot
# round-trip alloy's serde types (skip_serializing_if / quantity attributes).
alloy-rlp = { workspace = true }
zstd = "0.13.3"

# redb backend
redb = { version = "3.1.0", optional = false }

# mdbx backend- default
reth-libmdbx = { workspace = true, optional = true, features = [
    "return-borrowed",
    "read-tx-timeouts",
] }
page_size = { version = "0.6.0", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tn-reth = { workspace = true }
tn-test-utils = { workspace = true }
rand = { workspace = true }
roaring = { workspace = true }
# Async barrier tests for the durable `persist` need a runtime + timers.
tokio = { workspace = true, features = [ "macros", "rt", "time" ] }

[features]
redb = []
reth-libmdbx = ["dep:reth-libmdbx", "dep:page_size"]
default = ["reth-libmdbx"]
test-utils = []
# Adiri testnet fork logic gated on `tn_types::forks` — pull in the constants.
adiri = ["tn-types/adiri"]

[lints]
workspace = true
