[package]
name = "tn-lmdb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Embedded copy-on-write B+tree key-value engine: one page file, snapshot readers, a single writer and atomic meta-page commits."
publish = false

[dependencies]
crc32fast = "1.5.0"
libc = "0.2"
memmap2 = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The gap fill's read that does not wait for the disk (`preadv2` with `RWF_NOWAIT`) and its
# `POSIX_FADV_RANDOM`, as safe calls: no `unsafe` of this crate's own (`file.rs`).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
