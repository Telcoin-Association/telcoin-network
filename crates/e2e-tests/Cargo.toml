[package]
name = "e2e-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
exclude.workspace = true

[dependencies]
telcoin-network-cli = { workspace = true, features = ["test-utils"] }
clap = { workspace = true, features = ["derive", "env"] }
eyre = { workspace = true }
tn-config = { workspace = true }
tn-node = { workspace = true }
# not dev-only: `src/lib.rs` seeds reth's transaction pool defaults before it parses a node command
tn-reth = { workspace = true, features = ["test-utils"] }
tn-types = { workspace = true, features = ["test-utils"] }
tracing = { workspace = true }
jsonrpsee = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "macros",
    "time",
    "rt-multi-thread",
] }
futures = { workspace = true, optional = true }
escargot = { workspace = true }
alloy = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
# `pack_validate` re-runs a node's own epoch pack integrity checks from the harness. `test-utils`
# is `tn-types/test-utils`, which the fork-epoch overrides live behind: the harness decodes pack
# bytes itself, so it has to honor the same fork pins it forwards to every spawned node.
tn-storage = { workspace = true, features = ["test-utils"] }
tn-test-utils = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
rand_chacha = { workspace = true }
rand = { workspace = true }

# Used for integration testing.
ethereum-tx-sign = "6.1.3"
const-hex = "1.12.0"

nix = { version = "0.29", features = ["signal"] }
secp256k1 = { workspace = true, features = [
    "global-context",
    "rand",
    "recovery",
] }

[features]
default = []
faucet = ["dep:futures", "tn-reth/faucet"]

[lints]
workspace = true
