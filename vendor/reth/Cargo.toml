resolver = "2"

# Vendored third-party code is linted like a registry dependency. Cargo caps the lints of
# registry and git dependencies at `allow`; a path dependency is not capped, so without this
# table upstream's own lint levels (including its `deny` entries) would apply under TN's
# feature subset. Every vendored manifest inherits this table through `[lints] workspace = true`.
# Crate roots additionally carry `#![allow(warnings, unused_extern_crates)]` because RUSTFLAGS
# (`-D warnings` in CI) are appended after these flags.
[workspace.lints.rust]
warnings = "allow"

