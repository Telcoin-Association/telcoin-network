[package]
name = "reth-static-file-types"
version.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Commonly used types for static file usage in reth."

[lints]
workspace = true

[dependencies]
alloy-primitives.workspace = true
tracing = { workspace = true, optional = true }

clap = { workspace = true, features = ["derive"], optional = true }
fixed-map.workspace = true
derive_more.workspace = true
serde = { workspace = true, features = ["alloc", "derive"] }
reth-stages-types.workspace = true
strum = { workspace = true, features = ["derive"] }
# TN(TN-0117): `fsync_file` for the `.csoff` sidecar's syncs (std only, like the sidecar).
reth-fs-util = { workspace = true, optional = true }
# TN(TN-0121): the checksummed `.csoff` records (std only, like the sidecar).
crc32fast = { workspace = true, optional = true }

[dev-dependencies]
reth-nippy-jar.workspace = true
serde_json.workspace = true
insta.workspace = true
tempfile.workspace = true

[features]
default = ["std"]
std = [
    "alloy-primitives/std",
    "derive_more/std",
    "reth-stages-types/std",
    "serde/std",
    "strum/std",
    "serde_json/std",
    "fixed-map/std",
    "dep:tracing",
    "tracing?/std",
    "dep:reth-fs-util",
    "dep:crc32fast",
    "crc32fast?/std",
]
clap = ["dep:clap"]
