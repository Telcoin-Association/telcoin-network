[package]
name = "reth-rpc-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Reth RPC interfaces"

[lints]
workspace = true

[dependencies]
# reth
reth-rpc-eth-api.workspace = true
reth-trie-common.workspace = true
# TN(TN-0021): reth-engine-primitives, reth-network-peers, reth-chain-state, alloy-serde and the
# alloy admin/anvil/txpool/beacon/engine rpc types served only the removed namespaces.

# ethereum
alloy-eip7928 = { workspace = true, features = ["serde"] }
alloy-eips.workspace = true
alloy-json-rpc.workspace = true
alloy-primitives.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-rpc-types.workspace = true
alloy-rpc-types-debug.workspace = true
alloy-rpc-types-trace.workspace = true
alloy-rpc-types-mev.workspace = true
alloy-genesis.workspace = true

# misc
jsonrpsee = { workspace = true, features = ["server", "macros"] }
serde_json.workspace = true

[features]
client = [
    "jsonrpsee/client",
    "jsonrpsee/async-client",
    "reth-rpc-eth-api/client",
]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
jsonrpsee = { workspace = true, features = ["client", "async-client", "http-client"] }
