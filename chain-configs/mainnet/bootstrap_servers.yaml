# Bootstrap servers for mainnet (chain id 731), built into the binary.
#
# PLACEHOLDERS: these are the throwaway mainnet placeholder validators on loopback addresses
# (chain-configs/README.md). The real list is set before launch.
#
# A node started with `--chain mainnet` dials these to join the network. They serve only that
# first contact: once a node has peers, kademlia and the peer records it learns take over.
# Listing a server here grants no committee membership; any reachable node can serve, and the
# list need not match the genesis committee.
#
# The list changes with a software release: edit this file and build a new binary.
# `network-config`'s `bootstrap_peers` and the node's `--bootstrap-peers` flag override it.
# Each entry is keyed by the server's BLS public key and lists its primary and its workers in
# worker id order; every address ends with `/p2p/<peer id>` of the entry's network key.
