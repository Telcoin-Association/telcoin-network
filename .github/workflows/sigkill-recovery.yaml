# Captured reproductions for #1510. This lane records a recovery result; the historical
# fleet freeze still requires a failing reproduction before its root cause can be fixed.
name: SIGKILL recovery

on:
  push:
    branches:
      - "ci/sigkill-*"
  workflow_dispatch:
    inputs:
      epoch_secs:
        description: "Epoch duration: 10 for a short run, 1200 for fleet B"
        default: "10"
      before_close_secs:
        description: "Late-kill offset before the boundary: 2 locally, 59 for fleet B"
        default: "2"
      downtime_secs:
        description: "Minimum time from kill to restart: 18 locally, 300 for fleet B"
        default: "18"
      recovery_secs:
        description: "Catch-up deadline after restart, with capture every minute"
        default: "180"
      sync_mode:
        description: "MDBX sync regime inherited by every node"
        type: choice
        options:
          - both
          - durable
          - safe-no-sync
        default: both

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TARGET_DIR: target
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  TN_TEST_MDBX_SYNC: durable
  TN_SIGKILL_EPOCH_SECS: ${{ inputs.epoch_secs || '10' }}
  TN_SIGKILL_BEFORE_CLOSE_SECS: ${{ inputs.before_close_secs || '2' }}
  TN_SIGKILL_DOWNTIME_SECS: ${{ inputs.downtime_secs || '18' }}
  TN_SIGKILL_RECOVERY_SECS: ${{ inputs.recovery_secs || '180' }}

jobs:
  reproduce:
    name: ${{ matrix.sync_mode }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    # One fleet-timed case per job: the five-hour test budget leaves an hour for the build.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sync_mode: ${{ fromJSON(inputs.sync_mode == 'durable' && '["durable"]' || inputs.sync_mode == 'safe-no-sync' && '["safe-no-sync"]' || '["durable","safe-no-sync"]') }}
        scenario: [before_epoch_close, mid_epoch]
    env:
      TN_TEST_MDBX_SYNC: ${{ matrix.sync_mode }}
      SIGKILL_FILTER: test(sigkill::test_sigkill_${{ matrix.scenario }}_recovers)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install pinned toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          nightly="$(cat rust-nightly)"
          rustup toolchain install "$nightly" -c rustfmt,clippy --profile minimal
          echo "RUST_NIGHTLY=$nightly" >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: durable-e2e-cache
          cache-on-failure: "true"

      - name: Validate formatting and the full workspace lint plan
        run: |
          cargo +"$RUST_NIGHTLY" fmt --all -- --check
          cargo +"$RUST_NIGHTLY" clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Build and run the captured SIGKILL scenario
        run: |
          cargo fetch --locked
          make test-sigkill
          mkdir -p "validation-logs/$TN_TEST_MDBX_SYNC"
          cp -R crates/e2e-tests/test_logs/sigkill* "validation-logs/$TN_TEST_MDBX_SYNC/"

      - name: Reject timing settings beyond the per-case watchdog budget
        env:
          TN_SIGKILL_EPOCH_SECS: "2000"
          TN_SIGKILL_BEFORE_CLOSE_SECS: "2"
          TN_SIGKILL_DOWNTIME_SECS: "18"
          TN_SIGKILL_RECOVERY_SECS: "180"
        run: |
          if timeout 60s env TN_BIN_PATH="$PWD/target/e2e/telcoin-network" cargo nextest run --profile sigkill --locked -p e2e-tests --test it --run-ignored all -E "$SIGKILL_FILTER" > timing-budget.log 2>&1; then
            echo "::error::Over-budget timing settings were accepted"
            exit 1
          fi
          python3 -I - <<'PY'
          from pathlib import Path
          log = Path("timing-budget.log").read_text()
          if "Error: SIGKILL settings need " not in log or "watchdog budget" not in log:
              raise SystemExit("oversized timing must fail before nodes start")
          PY

      - name: Confirm recovery detects an omitted restart
        env:
          TN_SIGKILL_EPOCH_SECS: "10"
          TN_SIGKILL_BEFORE_CLOSE_SECS: "2"
          TN_SIGKILL_DOWNTIME_SECS: "18"
          TN_SIGKILL_RECOVERY_SECS: "10"
        run: |
          sigkill_source=crates/e2e-tests/tests/it/sigkill.rs
          sigkill_original="$(mktemp)"
          cp "$sigkill_source" "$sigkill_original"
          trap 'cp "$sigkill_original" "$sigkill_source"; rm -f "$sigkill_original"' EXIT
          python3 -I - <<'PY'
          from pathlib import Path
          source = Path("crates/e2e-tests/tests/it/sigkill.rs")
          text = source.read_text()
          restart = "guard.replace(2, start(2, victim, data, test, 1))?;"
          if text.count(restart) != 1:
              raise SystemExit("expected exactly one restart to mutate")
          source.write_text(text.replace(restart, "// Mutation: the killed validator is never restarted."))
          PY
          if TN_BIN_PATH="$PWD/target/e2e/telcoin-network" cargo nextest run --profile sigkill --locked -p e2e-tests --test it --run-ignored all -E "$SIGKILL_FILTER" > mutation.log 2>&1; then
            echo "::error::The recovery test passed without restarting the killed validator"
            exit 1
          fi
          python3 -I - <<'PY'
          from pathlib import Path
          expected = "timed out waiting for condition: restarted validator catches up and becomes active"
          if Path("mutation.log").read_text().count("Error: " + expected) != 1:
              raise SystemExit("mutation must fail at the recovery assertion")
          PY

      - name: Confirm transaction and continued-chain comparisons detect divergence
        env:
          TN_SIGKILL_EPOCH_SECS: "10"
          TN_SIGKILL_BEFORE_CLOSE_SECS: "2"
          TN_SIGKILL_DOWNTIME_SECS: "18"
          TN_SIGKILL_RECOVERY_SECS: "180"
        run: |
          sigkill_source=crates/e2e-tests/tests/it/sigkill.rs
          sigkill_original="$(mktemp)"
          cp "$sigkill_source" "$sigkill_original"
          trap 'cp "$sigkill_original" "$sigkill_source"; rm -f "$sigkill_original"' EXIT
          for phase in transaction continued; do
            cp "$sigkill_original" "$sigkill_source"
            MUTATION_PHASE="$phase" python3 -I - <<'PY'
          import os
          from pathlib import Path
          source = Path("crates/e2e-tests/tests/it/sigkill.rs")
          text = source.read_text()
          comparison = "actual_hash == expected_hash"
          if text.count(comparison) != 1:
              raise SystemExit("expected exactly one chain comparison to mutate")
          replacement = comparison + ' && phase != "' + os.environ["MUTATION_PHASE"] + '"'
          source.write_text(text.replace(comparison, replacement))
          PY
            if TN_BIN_PATH="$PWD/target/e2e/telcoin-network" cargo nextest run --profile sigkill --locked -p e2e-tests --test it --run-ignored all -E "$SIGKILL_FILTER" > "chain-mutation-$phase.log" 2>&1; then
              echo "::error::The recovery test passed with a divergent $phase block"
              exit 1
            fi
            MUTATION_PHASE="$phase" python3 -I - <<'PY'
          import os
          from pathlib import Path
          phase = os.environ["MUTATION_PHASE"]
          expected = "Error: chain divergence at " + phase + " block "
          if expected not in Path("chain-mutation-" + phase + ".log").read_text():
              raise SystemExit("mutation must fail at the " + phase + " chain comparison")
          PY
          done

      - name: Assert committed source and lockfile restored
        run: git diff --exit-code

      - name: Archive retained data from a failed reproduction
        if: failure()
        run: |
          mkdir -p validation-logs/failed-data
          for marker in crates/e2e-tests/test_logs/sigkill*/retained-datadir.txt; do
            [ -f "$marker" ] || continue
            retained_dir="$(cat "$marker")"
            case_name="$(basename "$(dirname "$marker")")"
            tar -czf "validation-logs/failed-data/$case_name.tgz" -C "$retained_dir" .
          done

      - name: Preserve successful and failed recovery capture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigkill-recovery-${{ matrix.sync_mode }}-${{ matrix.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crates/e2e-tests/test_logs/sigkill*
            validation-logs
            mutation.log
            timing-budget.log
            chain-mutation-*.log
          if-no-files-found: warn
          retention-days: 15
