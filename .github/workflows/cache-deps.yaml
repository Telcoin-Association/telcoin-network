# Warms the dependency caches that .github/workflows/pr.yaml restores.
#
# main is the only writer. A cache saved by a pull_request run is scoped to that PR's
# branch and one saved by a merge_group run lands on the queue's throwaway branch, so no
# other run ever reads either. pr.yaml therefore only restores (`save-if: "false"`), on
# both events, and reads what this workflow wrote on main. A lane's cold build is paid
# once here, off the critical path, instead of on every queue entry.
#
# Two jobs, two entries, one per toolchain pr.yaml uses:
#
#   clippy-cache  both clippy passes (default and --all-features) under the nightly pin;
#                 read by pr.yaml's `clippy` job
#   test-cache    the test binaries of both test lanes (default and adiri features) under
#                 the stable pin; read by `test` and `adiri-test`
#
# rust-cache's key is <prefix-key>-<shared-key>-<os>-<hash of the rustc version and every
# CARGO*/RUST* variable in the environment>-<hash of the lockfiles>. For a restore in
# pr.yaml to hit, the env block and every step before the cache step must match this file:
# the same six variables, plus RUST_NIGHTLY written to GITHUB_ENV before the cache step in
# the clippy jobs. Keep the two files in lockstep by hand; there is no shared definition
# yet. A `rust-nightly` bump changes RUST_NIGHTLY, so the whole key, which is why that file
# is in `paths` below. The computed key is printed in each cache step's "Cache
# Configuration" log group.
#
# Entries are immutable and an exact key hit skips the save. A change to WHAT a job here
# builds (a lane added, a feature set changed) is therefore never written while the key
# stays the same: bump `prefix-key` in both workflows, here first and in pr.yaml once main
# has written the new entries (or delete the entries under Settings > Actions > Caches).
#
# No `cache-on-failure`: a warm job that died mid-build would freeze a partial target dir
# under the exact key, permanently. A failed warm saves nothing; fix it and re-dispatch.
name: Warm dependency cache

on:
  push:
    branches: [main]
    # Anything that changes the key or what the jobs build.
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "rust-nightly"
      - ".cargo/config.toml"
      - "etc/ci-lanes.sh"
      - ".github/workflows/cache-deps.yaml"
  # Re-warm by hand: after deleting entries, or when a warm failed.
  workflow_dispatch:
  # GitHub deletes an entry not accessed for 7 days, so a quiet week would leave the queue
  # cold. Twice a week keeps the entries alive; on an exact hit the run restores, rebuilds
  # only the workspace crates, saves nothing and is done in a few minutes. Off the hour to
  # dodge the scheduled-load spike.
  schedule:
    - cron: "23 5 * * 1,4"

# Only reads the repository; cache writes go through the cache service, not the token.
permissions:
  contents: read

# One warm at a time, never cancelled: a schedule and a push landing together would
# otherwise race to save the same key.
concurrency:
  group: issue-1348-clippy-baseline
  cancel-in-progress: false

# Identical to pr.yaml on purpose: every variable here is hashed into the cache key.
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Steps up to the cache step mirror pr.yaml's `clippy` job.
  warm-clippy-cache:
    runs-on: ubuntu-latest
    # Both passes from cold, after a heavy dependency bump; the --all-features pass alone
    # took 11.5 min with a partial cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Before the cache step: RUST_NIGHTLY is part of the key.
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c clippy,rust-src --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: clippy-cache

      - name: Compare all-target diagnostics with the PR base
        run: |
          validation_head="$(git rev-parse HEAD)"
          validation_logs="$(mktemp -d "$RUNNER_TEMP/issue-1348-clippy.XXXXXX")"
          trap 'git checkout --detach "$validation_head"' EXIT
          head_status=0
          cargo "+$RUST_NIGHTLY" clippy --locked --workspace --all-targets --no-deps --keep-going --message-format=json -j 2 -- -D warnings > "$validation_logs/head.jsonl" 2> "$validation_logs/head.stderr" || head_status=$?
          git checkout --detach ba7654d8a7efe8b0ea13aa07c0d81938f843cb2d
          base_status=0
          cargo "+$RUST_NIGHTLY" clippy --locked --workspace --all-targets --no-deps --keep-going --message-format=json -j 2 -- -D warnings > "$validation_logs/base.jsonl" 2> "$validation_logs/base.stderr" || base_status=$?
          python3 - "$validation_logs" "$head_status" "$base_status" <<'PY'
          import collections
          import json
          from pathlib import Path
          import sys

          directory = Path(sys.argv[1])
          def diagnostics(name, status):
              errors = collections.Counter()
              for line in (directory / f"{name}.jsonl").read_text().splitlines():
                  entry = json.loads(line)
                  if entry.get("reason") != "compiler-message":
                      continue
                  message = entry["message"]
                  if message["level"] != "error":
                      continue
                  spans = tuple(
                      (span["file_name"], tuple(text["text"] for text in span["text"]))
                      for span in message["spans"] if span["is_primary"]
                  )
                  code = (message.get("code") or {}).get("code", "")
                  errors[(entry["target"]["name"], code, message["message"], spans)] += 1
              print(f"{name}: exit={status}, compiler errors={sum(errors.values())}")
              if status not in (0, 101) or (status != 0 and not errors):
                  print((directory / f"{name}.stderr").read_text())
                  raise SystemExit(f"{name}: validation infrastructure or unclassified failure")
              return errors

          head = diagnostics("head", int(sys.argv[2]))
          base = diagnostics("base", int(sys.argv[3]))
          added = head - base
          for diagnostic, count in sorted(head.items()):
              print(f"HEAD {count}x {diagnostic!r}")
          for diagnostic, count in sorted(added.items()):
              print(f"NEW {count}x {diagnostic!r}")
          if added:
              raise SystemExit("PR introduces new all-target Clippy diagnostics")
          print("No new all-target Clippy diagnostics relative to the exact PR base")
          PY

  # Steps up to the cache step mirror pr.yaml's `test` and `adiri-test` jobs.
  warm-test-cache:
    if: ${{ false }}
    runs-on: ubuntu-latest
    # Both lanes' test binaries from cold; the default lane alone took 9.5 min with a
    # partial cache after a heavy dependency bump.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: test-cache

      # Both test lanes into one target dir. The adiri feature set unifies differently
      # (tn-reth/adiri pulls in faucet and tn-types/adiri, and resolver-2 unification is
      # per selected package), so its dependency artifacts are distinct from the default
      # lane's; the two sets coexist in target/, and rust-cache keeps every variant of a
      # dependency it finds there. One entry keeps the quota predictable.
      - name: Run both test lanes for issue 1348
        run: |
          ./etc/ci-lanes.sh test-default
          ./etc/ci-lanes.sh test-adiri

      - name: Verify epoch-fee regression tests detect an inverted block selector
        shell: bash
        run: |
          trap 'git restore -- crates/tn-reth/src/rpc_call.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/tn-reth/src/rpc_call.rs')
          source = path.read_text()
          original = '    matches!(block_id, BlockId::Number(BlockNumberOrTag::Latest | BlockNumberOrTag::Pending))'
          assert source.count(original) == 1, 'mutation target must be unique'
          path.write_text(source.replace(original, original.replace('matches!', '!matches!')))
          PY
          set +e
          cargo nextest run --locked --workspace -E 'test(test_rpc_simulation_)' --no-fail-fast 2>&1 | tee /tmp/issue-1348-mutant.log
          mutant_status=${PIPESTATUS[0]}
          set -e
          test "$mutant_status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('crates/tn-reth/src/env/rpc/tests/simulation.rs').read_text()
          expected = re.findall(r'async fn (test_rpc_simulation_\w+)', source)
          log = re.sub(r'\x1b\[[0-9;]*m', '', Path('/tmp/issue-1348-mutant.log').read_text())
          missing = [name for name in expected if not any('FAIL' in line and name in line for line in log.splitlines())]
          assert len(expected) == 6 and not missing, f'mutation did not fail all six tests: {missing}'
          print('Mutation confirmed: all six epoch-fee regression tests failed.')
          PY
          git restore -- crates/tn-reth/src/rpc_call.rs
          cargo nextest run --locked --workspace -E 'test(test_rpc_simulation_)'
          git diff --exit-code -- Cargo.lock crates/tn-reth/src/rpc_call.rs
