# Warms the dependency caches that .github/workflows/pr.yaml restores.
#
# main is the only writer of the entries the lanes restore. A cache saved by a
# pull_request run is scoped to that PR's branch and one saved by a merge_group run lands
# on the queue's throwaway branch, so no other run ever reads either. pr.yaml therefore
# only restores (`save-if: "false"`), on both events, and reads what this workflow wrote
# on main. A lane's cold dependency build is paid once here, off the critical path,
# instead of on every queue entry.
#
# Two warm jobs, two entries, one per toolchain pr.yaml uses:
#
#   clippy-cache  both clippy passes (default and --all-features) under the nightly pin;
#                 read by pr.yaml's `clippy` job
#   test-cache    dependencies for both test lanes (default and adiri features) under
#                 the stable pin; read by `test` and `adiri-test`. Workspace test binaries
#                 are rebuilt per run because rust-cache does not save workspace crates.
#
# A third job, prune-caches, runs after both warms on main and deletes the superseded
# generations of these two entries and of durable-e2e.yaml's, which would otherwise stay
# until they went 7 days unread. The comment above the job has the rule and what it never
# touches.
#
# rust-cache builds the key as follows (checked against v2.9.2; a later release can
# change it, and the paragraph on such releases below says how one that does can move):
#
#   <prefix-key>-<shared-key>-<os>-<arch>-<env hash>-<hash of relevant Cargo manifests,
#   lockfiles and toolchain/config files>
#
# so the entries here start with v1-rust-clippy-cache-Linux-x64- and
# v1-rust-test-cache-Linux-x64-. The env hash covers `rustc -vV` of every toolchain that
# `rustup toolchain list` reports, plus every variable whose name starts with CARGO, CC,
# CFLAGS, CXX, CMAKE or RUST and whose value is non-empty. For a restore in pr.yaml to
# hit, the env block and every step before the cache step must match this file: the same
# six variables, plus RUST_NIGHTLY written to GITHUB_ENV before the cache step in the
# clippy jobs, and the same steps that install a toolchain, because the set of installed
# toolchains is hashed. That set also holds the stable Rust preinstalled on the
# ubuntu-latest image, which this repository does not control: when GitHub updates the
# image to a new Rust release, every key changes with it (.github/ACTIONS.md, "Caches").
# Keep the two files in lockstep by hand; there is no shared definition yet. A
# `rust-nightly` bump changes RUST_NIGHTLY and the installed nightly, so the whole key,
# which is why that file is in `paths` below. Each cache step prints the computed key in
# its "Cache Configuration" log group, with a "Rust Versions:" list of every toolchain it
# hashed.
#
# Entries are immutable and an exact key hit skips the save. A change to WHAT a job here
# builds (a lane added, a feature set changed) is therefore never written while the key
# stays the same: bump `prefix-key` here and in pr.yaml in the same pull request (or
# delete the entries under Settings > Actions > Caches).
#
# A rust-cache release that changes how the key is computed is a change of key too, and
# moves the same way, here and in pr.yaml together. The merge queue then restores keys
# nothing has written yet and builds every dependency cold, from that pull request's own
# queue run until the warm its merge triggers here has finished; .github/ACTIONS.md
# ("Caches") has the one cold timing measured. Moving this file first no longer keeps the
# queue warm: prune-caches counts the old key's entries as a superseded generation and
# deletes them at the end of the first warm that saves the new ones, so pr.yaml would
# restore nothing until it moved too. To tell whether a release is one of these, read the
# release notes of every release between the old pin and the new one for anything about
# the key or hashing, or compare the "Cache Key" a warm prints before and after the bump.
#
# No `cache-on-failure`: a warm job that died mid-build would freeze a partial target dir
# under the exact key, permanently. A failed warm saves nothing; fix it and re-dispatch.
name: Warm dependency cache

on:
  push:
    branches: [main]
    # Anything that changes the key or what the jobs build.
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "rust-nightly"
      - ".cargo/config.toml"
      - "etc/ci-lanes.sh"
      - ".github/workflows/cache-deps.yaml"
  # Re-warm by hand: after deleting entries, when a warm failed, or when the runner
  # image's stable Rust changed and every key with it.
  workflow_dispatch:
  # GitHub deletes an entry not accessed for 7 days, so a quiet week would leave the queue
  # cold. Twice a week keeps the entries alive; on an exact hit the run restores, rebuilds
  # only the workspace crates, saves nothing and is done in a few minutes. Off the hour to
  # dodge the scheduled-load spike.
  schedule:
    - cron: "23 5 * * 1,4"

# The warm jobs only read the repository; their cache writes go through the cache
# service, not the token. prune-caches sets its own permissions.
permissions:
  contents: read

# One warm at a time, never cancelled: a schedule and a push landing together would
# otherwise race to save the same key.
concurrency:
  group: cache-deps
  cancel-in-progress: false

# Identical to pr.yaml on purpose: every variable here is hashed into the cache key.
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Steps up to the cache step mirror pr.yaml's `clippy` job.
  warm-clippy-cache:
    runs-on: ubuntu-latest
    # Both passes from cold, after a heavy dependency bump; the --all-features pass alone
    # took 11.5 min with a partial cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      # Before the cache step: RUST_NIGHTLY is part of the key.
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c clippy,rust-src --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: clippy-cache

      # The same lane the queue runs, so the same artifacts.
      - name: Build both clippy passes
        run: ./etc/ci-lanes.sh clippy

  # Steps up to the cache step mirror pr.yaml's `test` and `adiri-test` jobs.
  warm-test-cache:
    runs-on: ubuntu-latest
    # Both lanes' test binaries from cold; the default lane alone took 9.5 min with a
    # partial cache after a heavy dependency bump.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: test-cache

      # Both test lanes into one target dir. The adiri feature set unifies differently
      # (tn-reth/adiri pulls in faucet and tn-types/adiri, and resolver-2 unification is
      # per selected package), so its dependency artifacts are distinct from the default
      # lane's; the two sets coexist in target/, and rust-cache keeps every variant of a
      # dependency it finds there. One entry keeps the quota predictable.
      - name: Build the test binaries of both test lanes
        run: |
          ./etc/ci-lanes.sh test-default --build-only
          ./etc/ci-lanes.sh test-adiri --build-only

  # Deletes the superseded cache generations, through .github/scripts/prune_caches.sh,
  # whose header has the rule in full. A family is every entry on refs/heads/main whose
  # key starts v<N>-rust-clippy-cache-, v<N>-rust-test-cache- or
  # v<N>-rust-durable-e2e-cache-, whatever its prefix-key version, architecture and
  # hashes. The live entries of a family are those created since this run began, else
  # those accessed since, else the single most recently accessed one; the rest are
  # deleted, so a family is never left empty. Nothing outside the three families is ever
  # touched: not CodeQL's entries, not another ref's, not another workflow's shared key.
  # Without this job each Cargo.lock change on main leaves the previous generation behind
  # until it goes 7 days unread, or until GitHub evicts the least recently used entries
  # past the quota, which can take a live one with it.
  #
  # It sits after the warms because they have just restored or saved the live clippy and
  # test entries, which is what marks them as touched since the run began. "Began" is the
  # first attempt's start: the run's own run_started_at is the latest attempt's, and
  # re-running this job alone would move it past the warms and leave the live entries
  # unmarked. Only on main: a warm dispatched on another branch writes that branch's own
  # scope and must not prune main's. With no status function in `if`, the job also runs
  # only when both warms succeeded.
  #
  # This is the first job in these workflows to use the token for more than reading.
  # `actions: write` is what deleting a cache entry needs. For this repository, and until
  # the job ends, it would also let the token cancel, re-run, approve or delete workflow
  # runs, delete logs and artifacts, and enable, disable or dispatch workflows. What runs
  # with it is the pinned checkout and the script as it stands in this commit on main.
  prune-caches:
    needs: [warm-clippy-cache, warm-test-cache]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      # There is no run start in the `github` context; the REST API has it.
      - name: Delete superseded cache generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          this_run="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          started=$(gh api "${this_run}/attempts/1" --jq .run_started_at)
          RUN_STARTED_AT="${started:?no start time for this run}" \
            .github/scripts/prune_caches.sh
