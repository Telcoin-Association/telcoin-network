name: Issue 1377 focused validation

on:
  workflow_dispatch:
    inputs:
      pr_head:
        description: Exact PR commit whose source files must match
        required: true
        type: string
      lane:
        description: Validation lane to run
        type: choice
        default: all
        options: [all, clippy, tests]

permissions:
  contents: read

concurrency:
  group: issue-1377-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  PR_HEAD: ${{ inputs.pr_head }}

jobs:
  clippy:
    if: inputs.lane != 'tests'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> "$GITHUB_ENV"
      - name: Install nightly toolchain
        run: rustup toolchain install "$RUST_NIGHTLY" -c clippy,rust-src --profile minimal
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: clippy-cache
          save-if: "false"
      - name: Lint the complete dependency-planner scope
        run: python3 -I etc/validate-1377.py clippy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1377-clippy
          path: validation-1377/
  focused-tests:
    if: inputs.lane != 'clippy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "false"
      - name: Run focused tests and mutation checks
        run: python3 -I etc/validate-1377.py tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1377-tests
          path: validation-1377/
