# Warms the dependency caches that .github/workflows/pr.yaml restores.
#
# main is the only writer. A cache saved by a pull_request run is scoped to that PR's
# branch and one saved by a merge_group run lands on the queue's throwaway branch, so no
# other run ever reads either. pr.yaml therefore only restores (`save-if: "false"`), on
# both events, and reads what this workflow wrote on main. A lane's cold build is paid
# once here, off the critical path, instead of on every queue entry.
#
# Two jobs, two entries, one per toolchain pr.yaml uses:
#
#   clippy-cache  both clippy passes (default and --all-features) under the nightly pin;
#                 read by pr.yaml's `clippy` job
#   test-cache    the test binaries of both test lanes (default and adiri features) under
#                 the stable pin; read by `test` and `adiri-test`
#
# rust-cache's key is <prefix-key>-<shared-key>-<os>-<hash of the rustc version and every
# CARGO*/RUST* variable in the environment>-<hash of the lockfiles>. For a restore in
# pr.yaml to hit, the env block and every step before the cache step must match this file:
# the same six variables, plus RUST_NIGHTLY written to GITHUB_ENV before the cache step in
# the clippy jobs. Keep the two files in lockstep by hand; there is no shared definition
# yet. A `rust-nightly` bump changes RUST_NIGHTLY, so the whole key, which is why that file
# is in `paths` below. The computed key is printed in each cache step's "Cache
# Configuration" log group.
#
# Entries are immutable and an exact key hit skips the save. A change to WHAT a job here
# builds (a lane added, a feature set changed) is therefore never written while the key
# stays the same: bump `prefix-key` in both workflows, here first and in pr.yaml once main
# has written the new entries (or delete the entries under Settings > Actions > Caches).
#
# No `cache-on-failure`: a warm job that died mid-build would freeze a partial target dir
# under the exact key, permanently. A failed warm saves nothing; fix it and re-dispatch.
name: Warm dependency cache

on:
  push:
    branches: [main]
    # Anything that changes the key or what the jobs build.
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "rust-toolchain.toml"
      - "rust-nightly"
      - ".cargo/config.toml"
      - "etc/ci-lanes.sh"
      - ".github/workflows/cache-deps.yaml"
  # Re-warm by hand: after deleting entries, or when a warm failed.
  workflow_dispatch:
  # GitHub deletes an entry not accessed for 7 days, so a quiet week would leave the queue
  # cold. Twice a week keeps the entries alive; on an exact hit the run restores, rebuilds
  # only the workspace crates, saves nothing and is done in a few minutes. Off the hour to
  # dodge the scheduled-load spike.
  schedule:
    - cron: "23 5 * * 1,4"

# Only reads the repository; cache writes go through the cache service, not the token.
permissions:
  contents: read

# One warm at a time, never cancelled: a schedule and a push landing together would
# otherwise race to save the same key.
concurrency:
  group: cache-deps
  cancel-in-progress: false

# Identical to pr.yaml on purpose: every variable here is hashed into the cache key.
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Steps up to the cache step mirror pr.yaml's `clippy` job.
  warm-clippy-cache:
    runs-on: ubuntu-latest
    # Both passes from cold, after a heavy dependency bump; the --all-features pass alone
    # took 11.5 min with a partial cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Before the cache step: RUST_NIGHTLY is part of the key.
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c clippy,rust-src --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: clippy-cache

      # The same lane the queue runs, so the same artifacts.
      - name: Build both clippy passes
        run: ./etc/ci-lanes.sh clippy

  # Steps up to the cache step mirror pr.yaml's `test` and `adiri-test` jobs.
  warm-test-cache:
    runs-on: ubuntu-latest
    # Both lanes' test binaries from cold; the default lane alone took 9.5 min with a
    # partial cache after a heavy dependency bump.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: test-cache

      # Both test lanes into one target dir. The adiri feature set unifies differently
      # (tn-reth/adiri pulls in faucet and tn-types/adiri, and resolver-2 unification is
      # per selected package), so its dependency artifacts are distinct from the default
      # lane's; the two sets coexist in target/, and rust-cache keeps every variant of a
      # dependency it finds there. One entry keeps the quota predictable.
      - name: Build the test binaries of both test lanes
        run: |
          ./etc/ci-lanes.sh test-default --build-only
          ./etc/ci-lanes.sh test-adiri --build-only

      - name: Validate issue 1338 regressions and guard mutations
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          builder_source=crates/batch-builder/src/lib.rs
          worker_source=crates/consensus/worker/src/worker.rs
          builder_test=tests::empty_build_after_pending_pool_drain_is_deferred
          validator_test=batch_provider_tests::validator_empty_seal_is_noop
          observer_test=batch_provider_tests::observer_empty_seal_is_noop
          regression_tests=("$builder_test" "$validator_test" "$observer_test")

          restore_sources() {
            git restore --source=HEAD -- "$builder_source" "$worker_source"
          }
          trap restore_sources EXIT

          # Preserve the cached default workspace feature and Cargo profile selection.
          cargo nextest list --locked --workspace --message-format json \
            -- "${regression_tests[@]}" --exact > "$RUNNER_TEMP/tn-1338-tests.json"
          python3 - "$RUNNER_TEMP/tn-1338-tests.json" "${regression_tests[@]}" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text())
          selected = [
              name
              for suite in report["rust-suites"].values()
              for name, test in suite.get("testcases", {}).items()
              if test["filter-match"]["status"] == "matches" and not test["ignored"]
          ]
          if sorted(selected) != sorted(sys.argv[2:]):
              raise SystemExit(f"Wrong regression selection: {selected}")
          print(f"Verified selection of all {len(selected)} regression tests")
          PY
          cargo nextest run --locked --workspace --no-fail-fast --retries 0 \
            -- "${regression_tests[@]}" --exact

          disable_guard() {
            python3 - "$1" "$2" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          guard = sys.argv[2]
          source = path.read_text()
          if source.count(guard) != 1:
              raise SystemExit(f"Expected exactly one guard in {path}")
          path.write_text(source.replace(guard, "if false {", 1))
          PY
          }

          expect_test_failure() {
            local regression_test="$1"
            local mutation_status=0
            cargo nextest run --locked --workspace --no-fail-fast --retries 0 \
              -- "$regression_test" --exact || mutation_status=$?
            # nextest reserves 100 for test failures; build and setup errors do not count.
            if [[ "$mutation_status" -ne 100 ]]; then
              echo "::error::Mutation for $regression_test returned $mutation_status, expected test failure 100"
              exit 1
            fi
          }

          # Mutate only the new guard conditions, one production file at a time.
          disable_guard "$builder_source" 'if batch.transactions().is_empty() {'
          expect_test_failure "$builder_test"
          restore_sources
          disable_guard "$worker_source" 'if sealed_batch.batch.transactions.is_empty() {'
          expect_test_failure "$validator_test"
          cargo nextest run --locked --workspace --no-fail-fast --retries 0 \
            -- "$observer_test" --exact
          restore_sources

          # Stall the initial build result to verify the regression's 10-second watchdog.
          python3 - "$builder_source" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text()
          original = "let done = batch_builder.spawn_execution_task();"
          replacement = (
              "let done = std::future::pending::<"
              "Result<BatchBuilderResult<BuildOutcome>, oneshot::error::RecvError>>();"
          )
          if source.count(original) != 1:
              raise SystemExit("Expected exactly one initial build result to stall")
          path.write_text(source.replace(original, replacement, 1))
          PY
          expect_test_failure "$builder_test"
          restore_sources

          # Rebuild and rerun fixed sources before the cache action's post-job save.
          cargo nextest run --locked --workspace --no-fail-fast --retries 0 \
            -- "${regression_tests[@]}" --exact
          git diff --exit-code -- "$builder_source" "$worker_source" Cargo.lock

      - name: Run full default and adiri suites with a strict 60-second test timeout
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          nextest_config=.config/nextest.toml
          restore_nextest_config() {
            git restore --source=HEAD -- "$nextest_config"
          }
          trap restore_nextest_config EXIT

          # Keep existing test groups and settings, tightening timeouts for every test.
          cat >> "$nextest_config" <<'TOML'

          [profile.issue1338-strict]
          inherits = "default"
          retries = 0

          [[profile.issue1338-strict.overrides]]
          filter = "all()"
          retries = 0
          slow-timeout = { period = "60s", terminate-after = 1, grace-period = "0s", on-timeout = "fail" }
          TOML
          export NEXTEST_PROFILE=issue1338-strict

          # Run the same feature/package lanes as CI, even if the first lane fails.
          default_status=0
          ./etc/ci-lanes.sh test-default || default_status=$?
          adiri_status=0
          ./etc/ci-lanes.sh test-adiri || adiri_status=$?
          restore_nextest_config
          git diff --exit-code -- "$nextest_config" Cargo.lock
          if [[ "$default_status" -ne 0 || "$adiri_status" -ne 0 ]]; then
            echo "::error::Full-suite validation failed: default=$default_status, adiri=$adiri_status"
            exit 1
          fi
