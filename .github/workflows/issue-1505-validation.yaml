name: Issue 1505 validation

on:
  push:
    branches: [ci/1505-worker-rpc-validation]

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  RUST_BACKTRACE: 1

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 441e5d0a91abaca291d6395bdc170812e0dc0763
          submodules: true
      - name: Install stable toolchain
        run: rustup toolchain install 1.94 --profile minimal
      - name: Install result checker
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Restore dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "true"
          cache-on-failure: "true"
      - name: Run lifecycle and admission regressions
        run: |
          cargo +1.94 test --locked -p tn-node --lib epoch_starts_all_workers_and_reuses_components -- --nocapture
          cargo +1.94 test --locked -p tn-reth --lib inactive_worker_submission_gate_covers_every_transport -- --nocapture
      - name: Mutate ordinary submission admission
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          p = Path("crates/tn-reth/src/rpc_fee_cap.rs")
          source = p.read_text()
          needle = "        self.admission.ensure_active()?;\n"
          assert source.count(needle) == 2
          p.write_text(source.replace(needle, "", 1))
          PY
          set +e
          cargo +1.94 test --locked -p tn-reth --lib inactive_worker_submission_gate_covers_every_transport -- --nocapture > admission-mutation.log 2>&1
          result=$?
          set -e
          cat admission-mutation.log
          test "$result" -eq 101
          rg -q 'inactive_worker_submission_gate_covers_every_transport .*FAILED' admission-mutation.log
          git restore crates/tn-reth/src/rpc_fee_cap.rs
      - name: Mutate synchronous submission admission
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          p = Path("crates/tn-reth/src/rpc_fee_cap.rs")
          source = p.read_text()
          needle = "        self.admission.ensure_active()?;\n"
          assert source.count(needle) == 2
          p.write_text("".join(source.rsplit(needle, 1)))
          PY
          set +e
          cargo +1.94 test --locked -p tn-reth --lib inactive_worker_submission_gate_covers_every_transport -- --nocapture > sync-admission-mutation.log 2>&1
          result=$?
          set -e
          cat sync-admission-mutation.log
          test "$result" -eq 101
          rg -q 'inactive_worker_submission_gate_covers_every_transport .*FAILED' sync-admission-mutation.log
          git restore crates/tn-reth/src/rpc_fee_cap.rs
      - name: Mutate listener retention
        run: |
          python3 -I - <<'PY'
          from pathlib import Path
          p = Path("crates/tn-reth/src/worker.rs")
          source = p.read_text()
          needle = "        self.network.rpc_admission.set_state(WorkerRpcState::Inactive);\n"
          assert source.count(needle) == 1
          p.write_text(source.replace(needle, needle + "        let _ = self.rpc_handle.clone().stop();\n", 1))
          PY
          set +e
          timeout 600s cargo +1.94 test --locked -p tn-node --lib epoch_starts_all_workers_and_reuses_components -- --nocapture > listener-mutation.log 2>&1
          result=$?
          set -e
          cat listener-mutation.log
          test "$result" -eq 101
          rg -q 'epoch_starts_all_workers_and_reuses_components .*FAILED' listener-mutation.log
          git restore crates/tn-reth/src/worker.rs
      - name: Verify source restoration
        run: git diff --exit-code
      - name: Run affected crate test suites after restoration
        run: cargo +1.94 nextest run --locked -p tn-node -p tn-reth --lib
      - name: Run affected adiri test suites
        run: cargo +1.94 nextest run --locked -p tn-node -p tn-reth --lib --features tn-node/adiri,tn-reth/adiri
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1505-mutations
          path: "*-mutation.log"
