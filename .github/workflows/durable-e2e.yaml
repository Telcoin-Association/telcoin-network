name: CI118 verification runner preflight

"on": workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'Telcoin-Association/telcoin-network' &&
          github.ref == 'refs/heads/work/1476-ci118-verification' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 4
    steps:
      - name: Probe disk and pinned run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: Telcoin-Association/telcoin-network
          EXPECTED_REPOSITORY_ID: "780459444"
          EXPECTED_HEAD: "4556f835e3d4a6f803afc941f4cfcd9cfd7faad1"
          EXPECTED_RUN: "37914665470"
          EXPECTED_REF: refs/heads/work/1476-ci118-verification
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_EVENT: ${{ github.event_name }}
          ACTUAL_RUN_ID: ${{ github.run_id }}
          ACTUAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
          ACTUAL_WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python3 -B -I - <<'PY'
          import json
          import os
          import platform
          import shutil
          import subprocess

          env = os.environ
          floor = 32 * 1024**3
          failures = []
          report = {"diagnostic_only": True, "capacity_qualified": False,
                    "workflow_ref": env["ACTUAL_WORKFLOW_REF"],
                    "workflow_commit": env["ACTUAL_WORKFLOW_COMMIT"],
                    "run_id": env["ACTUAL_RUN_ID"], "run_attempt": env["ACTUAL_RUN_ATTEMPT"],
                    "architecture": platform.machine(), "minimum_free_bytes": floor,
                    "filesystems": {}, "metadata_verified": False, "metadata_requests": 0}
          identity_ok = (env["ACTUAL_REPOSITORY"] == env["EXPECTED_REPOSITORY"]
                         and env["ACTUAL_REF"] == env["EXPECTED_REF"]
                         and env["ACTUAL_EVENT"] == "workflow_dispatch"
                         and env["ACTUAL_WORKFLOW_REF"] == env["EXPECTED_REPOSITORY"]
                         + "/.github/workflows/durable-e2e.yaml@" + env["EXPECTED_REF"])
          if not identity_ok:
              failures.append("unexpected_repository_ref_or_workflow")
          if platform.system() != "Linux" or platform.machine() not in ("aarch64", "arm64"):
              failures.append("unsupported_runner_architecture")
          for label, key in (("runner_temp", "RUNNER_TEMP"), ("workspace", "GITHUB_WORKSPACE")):
              try:
                  usage = shutil.disk_usage(env[key])
                  enough = usage.free >= floor
                  report["filesystems"][label] = {"path": env[key], "free_bytes": usage.free,
                                                   "total_bytes": usage.total, "at_least_32_gib_free": enough}
                  if not enough:
                      failures.append(label + "_below_32_gib")
              except (KeyError, OSError):
                  failures.append(label + "_disk_probe_unavailable")
          if identity_ok and "unsupported_runner_architecture" not in failures:
              endpoint = "repos/" + env["EXPECTED_REPOSITORY"] + "/actions/runs/" + env["EXPECTED_RUN"]
              fields = "{id,head_sha,run_attempt,event,workflow_id,path,repository_id:.repository.id,head_repository_id:.head_repository.id,status,conclusion}"
              try:
                  report["metadata_requests"] = 1
                  result = subprocess.run(["gh", "api", "--method", "GET", endpoint, "--jq", fields],
                                          capture_output=True, timeout=20)
                  if result.returncode or len(result.stdout) > 4096 or len(result.stderr) > 2048:
                      failures.append("metadata_get_failed_or_output_exceeded_bound")
                  else:
                      meta = json.loads(result.stdout)
                      report["metadata_verified"] = (isinstance(meta, dict)
                          and meta.get("id") == int(env["EXPECTED_RUN"])
                          and meta.get("head_sha") == env["EXPECTED_HEAD"]
                          and meta.get("repository_id") == meta.get("head_repository_id") == int(env["EXPECTED_REPOSITORY_ID"])
                          and meta.get("run_attempt") == 1 and meta.get("event") == "workflow_dispatch"
                          and meta.get("workflow_id") == 333176895
                          and meta.get("path") == ".github/workflows/durable-e2e.yaml")
                      if report["metadata_verified"]:
                          report["pinned_run"] = meta
                      else:
                          failures.append("metadata_source_repository_or_caller_mismatch")
              except (FileNotFoundError, subprocess.TimeoutExpired, ValueError):
                  failures.append("metadata_get_unavailable_timeout_or_invalid_json")
          report["failures"] = failures
          report["preflight_passed"] = not failures
          print(json.dumps(report, sort_keys=True))
          if failures:
              raise SystemExit("runner preflight failed: " + ",".join(failures))
          PY
