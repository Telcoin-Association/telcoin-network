name: CI122 independent hub capacity verification

"on":
  workflow_dispatch:
    inputs:
      helper_sha:
        description: Exact reviewed helper commit SHA
        required: true
        type: string
      publish:
        description: Publish the independently qualified seven-file evidence branch
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'Telcoin-Association/telcoin-network' &&
          github.ref == 'refs/heads/work/1476-ci122-verification' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      qualified: ${{ steps.verify.outputs.qualified }}
    env:
      EXPECTED_HELPER_SHA: ${{ inputs.helper_sha }}
      ACTUAL_REPOSITORY: ${{ github.repository }}
      ACTUAL_REF: ${{ github.ref }}
      ACTUAL_EVENT: ${{ github.event_name }}
      ACTUAL_RUN_ID: ${{ github.run_id }}
      ACTUAL_RUN_ATTEMPT: ${{ github.run_attempt }}
      ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
      ACTUAL_WORKFLOW_COMMIT: ${{ github.sha }}
    steps:
      - name: Check exact helper identity and fresh runner disk space
        shell: bash
        run: |
          python3 -B -I - <<'PY'
          import json
          import os
          import platform
          import re
          import shutil

          env = os.environ
          failures = []
          expected_sha = env["EXPECTED_HELPER_SHA"]
          if (not re.fullmatch("[0-9a-f]{40}", expected_sha)
              or env["ACTUAL_WORKFLOW_COMMIT"] != expected_sha
              or env["ACTUAL_REPOSITORY"] != "Telcoin-Association/telcoin-network"
              or env["ACTUAL_REF"] != "refs/heads/work/1476-ci122-verification"
              or env["ACTUAL_EVENT"] != "workflow_dispatch"
              or env["ACTUAL_WORKFLOW_REF"] != "Telcoin-Association/telcoin-network/.github/workflows/durable-e2e.yaml@refs/heads/work/1476-ci122-verification"):
              failures.append("unexpected_helper_repository_ref_workflow_or_commit")
          if platform.system() != "Linux" or platform.machine() not in ("aarch64", "arm64"):
              failures.append("unsupported_runner_architecture")
          filesystems = {}
          for label, key in (("runner_temp", "RUNNER_TEMP"), ("workspace", "GITHUB_WORKSPACE")):
              try:
                  if not os.path.isabs(env[key]) or not os.path.isdir(env[key]):
                      raise OSError("runner directory unavailable")
                  usage = shutil.disk_usage(env[key])
                  filesystems[label] = {"path": env[key], "free_bytes": usage.free,
                                        "total_bytes": usage.total, "at_least_32_gib_free": usage.free >= 32 * 1024**3}
                  if usage.free < 32 * 1024**3:
                      failures.append(label + "_below_32_gib")
              except (KeyError, OSError):
                  failures.append(label + "_disk_probe_unavailable")
          print(json.dumps({"capacity_qualified": False,
                            "independently_rescored": False,
                            "helper_sha": expected_sha if re.fullmatch("[0-9a-f]{40}", expected_sha) else None,
                            "run_id": env["ACTUAL_RUN_ID"], "run_attempt": env["ACTUAL_RUN_ATTEMPT"],
                            "workflow_ref": env["ACTUAL_WORKFLOW_REF"], "filesystems": filesystems,
                            "preflight_passed": not failures, "failures": failures}, sort_keys=True))
          if failures:
              raise SystemExit("verification preflight failed: " + ",".join(failures))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.helper_sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3914e53957fcc3ff7befe8b1a3f9a3284bfaba4b
          path: qualification-source
          persist-credentials: false
          fetch-depth: 0
      - name: Authenticate reviewed entrypoint bytes
        shell: bash
        run: |
          python3 -B -I - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("tools/ci122-verification")
          pins = {"1476-ci122-full-verify.py": "bc70473b6fe61a886e8da9c1b16b7235978a8886757fc84ab1a7910e6562a624",
                  "1476-ci122-publication.py": "1848455659b40972b3c71e56b64b0b9c37e772d00281c86d91cd5f65b2690970",
                  "1476-ci122-helper-inputs.json": "f41503b987fea2c6e2288f817e1de3ea6bf25f28e87f1b5d3f3bd85648f63d29"}
          for name, expected in pins.items():
              path = root / name
              if path.is_symlink() or not path.is_file() or path.stat().st_size > 1024**2 or hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit("reviewed entrypoint hash mismatch: " + name)
          PY
      - name: Independently authenticate and rescore fresh qualification
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B -I tools/ci122-verification/1476-ci122-full-verify.py
          --manifest tools/ci122-verification/1476-ci122-helper-inputs.json
          --manifest-sha256 f41503b987fea2c6e2288f817e1de3ea6bf25f28e87f1b5d3f3bd85648f63d29
          --source-checkout "$GITHUB_WORKSPACE/qualification-source"
      - name: Retain exact public bundle and bounded independent proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci122-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ci122/public-bundle
            ${{ runner.temp }}/ci122/proof.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: verify
    if: >-
      ${{ inputs.publish && needs.verify.result == 'success' &&
          needs.verify.outputs.qualified == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'Telcoin-Association/telcoin-network' &&
          github.ref == 'refs/heads/work/1476-ci122-verification' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      EXPECTED_HELPER_SHA: ${{ inputs.helper_sha }}
      ACTUAL_REPOSITORY: ${{ github.repository }}
      ACTUAL_REF: ${{ github.ref }}
      ACTUAL_EVENT: ${{ github.event_name }}
      ACTUAL_RUN_ID: ${{ github.run_id }}
      ACTUAL_RUN_ATTEMPT: ${{ github.run_attempt }}
      ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
      ACTUAL_WORKFLOW_COMMIT: ${{ github.sha }}
    steps:
      - name: Check exact helper identity and fresh runner disk space
        shell: bash
        run: |
          python3 -B -I - <<'PY'
          import json
          import os
          import platform
          import re
          import shutil

          env = os.environ
          failures = []
          expected_sha = env["EXPECTED_HELPER_SHA"]
          if (not re.fullmatch("[0-9a-f]{40}", expected_sha)
              or env["ACTUAL_WORKFLOW_COMMIT"] != expected_sha
              or env["ACTUAL_REPOSITORY"] != "Telcoin-Association/telcoin-network"
              or env["ACTUAL_REF"] != "refs/heads/work/1476-ci122-verification"
              or env["ACTUAL_EVENT"] != "workflow_dispatch"
              or env["ACTUAL_WORKFLOW_REF"] != "Telcoin-Association/telcoin-network/.github/workflows/durable-e2e.yaml@refs/heads/work/1476-ci122-verification"):
              failures.append("unexpected_helper_repository_ref_workflow_or_commit")
          if platform.system() != "Linux" or platform.machine() not in ("aarch64", "arm64"):
              failures.append("unsupported_runner_architecture")
          filesystems = {}
          for label, key in (("runner_temp", "RUNNER_TEMP"), ("workspace", "GITHUB_WORKSPACE")):
              try:
                  if not os.path.isabs(env[key]) or not os.path.isdir(env[key]):
                      raise OSError("runner directory unavailable")
                  usage = shutil.disk_usage(env[key])
                  filesystems[label] = {"path": env[key], "free_bytes": usage.free,
                                        "total_bytes": usage.total, "at_least_32_gib_free": usage.free >= 32 * 1024**3}
                  if usage.free < 32 * 1024**3:
                      failures.append(label + "_below_32_gib")
              except (KeyError, OSError):
                  failures.append(label + "_disk_probe_unavailable")
          print(json.dumps({"capacity_qualified": False,
                            "independently_rescored": False,
                            "helper_sha": expected_sha if re.fullmatch("[0-9a-f]{40}", expected_sha) else None,
                            "run_id": env["ACTUAL_RUN_ID"], "run_attempt": env["ACTUAL_RUN_ATTEMPT"],
                            "workflow_ref": env["ACTUAL_WORKFLOW_REF"], "filesystems": filesystems,
                            "preflight_passed": not failures, "failures": failures}, sort_keys=True))
          if failures:
              raise SystemExit("verification preflight failed: " + ",".join(failures))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.helper_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Download this attempt's independently qualified public bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci122-qualified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci122-publication-input
      - name: Authenticate publication guard and publish orphan evidence branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -I - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path("tools/ci122-verification/1476-ci122-publication.py")
          if path.is_symlink() or not path.is_file() or path.stat().st_size > 1024**2 or hashlib.sha256(path.read_bytes()).hexdigest() != "1848455659b40972b3c71e56b64b0b9c37e772d00281c86d91cd5f65b2690970":
              raise SystemExit("reviewed publication guard hash mismatch")
          PY
          python3 -B -I tools/ci122-verification/1476-ci122-publication.py \
            --bundle "$RUNNER_TEMP/ci122-publication-input/public-bundle" \
            --proof "$RUNNER_TEMP/ci122-publication-input/proof.json"
