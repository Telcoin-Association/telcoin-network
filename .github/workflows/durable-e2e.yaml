# Scheduled e2e lane (#1149, follow-up to #982 / #917): the restart and epoch suites, nightly.
#
# PR CI cannot afford the e2e suites, so this lane is the only CI that runs them. It was
# created to restore the Durable timing regime -- where the externalization barriers
# (`persist().await` before a certificate, header, or vote goes on the wire) wait on a real
# flush that races the proposer timers -- which MDBX test builds removed (`SafeNoSync`), by
# exporting TN_TEST_MDBX_SYNC=durable to the spawned nodes. The node's consensus DB is now
# tndb, which syncs for real at every barrier in every build, so every e2e run is in that
# regime and the variable no longer reaches the node (it still selects the sync mode of the
# MDBX backend that storage tests and benches use; see crates/storage/src/mdbx/database.rs).
name: Durable e2e

on:
  schedule:
    # Nightly at 08:17 UTC, off the top of the hour to dodge the scheduled-load spike.
    - cron: "17 8 * * *"
  workflow_dispatch:

# The job only reads the repository (checkout + build + test); the token gets no
# write scopes (least privilege, CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# sigkill-recovery.yaml restores this job's durable-e2e-cache entry, so its env block and
# its steps up to the cache step match these: rust-cache hashes both into the key. Change
# them together.
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  durable-e2e:
    runs-on: ubuntu-latest
    # Covers a cold cache: full workspace test-binary build plus both e2e suites run
    # serialized (nextest pins the e2e group to max-threads 1).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      # The runner image's own stable Rust would be hashed into the cache key, so it goes
      # after the last toolchain install and before the cache step (cache-deps.yaml's
      # header says why). The list that follows is the set the key hashes.
      - name: Remove the runner image's Rust
        run: |
          rustup toolchain uninstall stable
          rustup toolchain list

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: durable-e2e-cache
          cache-on-failure: "true"

      # Untimed: absorbs the node-binary build and the test-binary compiles of both package
      # selections the suites use, and validates the committed lockfile (`fetch --locked`
      # fails on drift, matching the `--locked` discipline of pr.yaml), so the timed suite
      # steps below are compile-free. There are two selections because `make test-restarts`
      # runs an unscoped `cargo nextest run`, which the `--workspace` build covers, while
      # `make test-epochs` and `make test-sigkill` run `-p e2e-tests --test it`, which
      # resolves features for e2e-tests alone and compiles a set of its own. Without the
      # second build, those two suites compiled inside their timed steps.
      - name: Build node binary and test binaries (untimed)
        run: |
          cargo fetch --locked
          make build-e2e-bin
          cargo nextest run --no-run --locked --workspace
          cargo nextest run --no-run --locked -p e2e-tests --test it

      - name: Run restart e2e tests
        run: make test-restarts

      - name: Run epoch e2e tests
        run: make test-epochs

      - name: Run direct SIGKILL epoch-boundary recovery tests
        run: make test-sigkill

      - name: Archive retained data from a failed SIGKILL reproduction
        if: failure()
        run: |
          mkdir -p validation-logs/failed-data
          for marker in crates/e2e-tests/test_logs/sigkill*/retained-datadir.txt; do
            [ -f "$marker" ] || continue
            retained_dir="$(cat "$marker")"
            case_name="$(basename "$(dirname "$marker")")"
            tar -czf "validation-logs/failed-data/$case_name.tgz" -C "$retained_dir" .
          done

      - name: Preserve crash-recovery capture
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigkill-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            crates/e2e-tests/test_logs/sigkill*
            validation-logs/failed-data
          if-no-files-found: warn
          retention-days: 15

      - name: Assert lockfile unchanged
        run: git diff --exit-code -- Cargo.lock
