name: CI118 CPU interval diagnostics

"on":
  workflow_dispatch:
    inputs:
      helper_sha:
        description: Exact reviewed helper commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  diagnostic:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.repository == 'Telcoin-Association/telcoin-network' &&
          github.ref == 'refs/heads/work/1476-ci118-verification' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      EXPECTED_HELPER_SHA: ${{ inputs.helper_sha }}
      ACTUAL_REPOSITORY: ${{ github.repository }}
      ACTUAL_REF: ${{ github.ref }}
      ACTUAL_EVENT: ${{ github.event_name }}
      ACTUAL_RUN_ID: ${{ github.run_id }}
      ACTUAL_RUN_ATTEMPT: ${{ github.run_attempt }}
      ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
      ACTUAL_WORKFLOW_COMMIT: ${{ github.sha }}
    steps:
      - name: Check exact helper identity and fresh runner disk space
        shell: bash
        run: |
          python3 -B -I - <<'PY'
          import json
          import os
          import platform
          import re
          import shutil

          env = os.environ
          failures = []
          expected_sha = env["EXPECTED_HELPER_SHA"]
          if (not re.fullmatch("[0-9a-f]{40}", expected_sha)
              or env["ACTUAL_WORKFLOW_COMMIT"] != expected_sha
              or env["ACTUAL_REPOSITORY"] != "Telcoin-Association/telcoin-network"
              or env["ACTUAL_REF"] != "refs/heads/work/1476-ci118-verification"
              or env["ACTUAL_EVENT"] != "workflow_dispatch"
              or env["ACTUAL_WORKFLOW_REF"] != "Telcoin-Association/telcoin-network/.github/workflows/durable-e2e.yaml@refs/heads/work/1476-ci118-verification"):
              failures.append("unexpected_helper_repository_ref_workflow_or_commit")
          if platform.system() != "Linux" or platform.machine() not in ("aarch64", "arm64"):
              failures.append("unsupported_runner_architecture")
          filesystems = {}
          for label, key in (("runner_temp", "RUNNER_TEMP"), ("workspace", "GITHUB_WORKSPACE")):
              try:
                  if not os.path.isabs(env[key]) or not os.path.isdir(env[key]):
                      raise OSError("runner directory unavailable")
                  usage = shutil.disk_usage(env[key])
                  filesystems[label] = {"path": env[key], "free_bytes": usage.free,
                                        "total_bytes": usage.total, "at_least_32_gib_free": usage.free >= 32 * 1024**3}
                  if usage.free < 32 * 1024**3:
                      failures.append(label + "_below_32_gib")
              except (KeyError, OSError):
                  failures.append(label + "_disk_probe_unavailable")
          print(json.dumps({"diagnostic_only": True, "capacity_qualified": False,
                            "independently_rescored": False,
                            "helper_sha": expected_sha if re.fullmatch("[0-9a-f]{40}", expected_sha) else None,
                            "run_id": env["ACTUAL_RUN_ID"], "run_attempt": env["ACTUAL_RUN_ATTEMPT"],
                            "workflow_ref": env["ACTUAL_WORKFLOW_REF"], "filesystems": filesystems,
                            "preflight_passed": not failures, "failures": failures}, sort_keys=True))
          if failures:
              raise SystemExit("diagnostic preflight failed: " + ",".join(failures))
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.helper_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed public helper bytes and stage metadata
        shell: bash
        run: |
          python3 -B -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "tools/ci118-diagnostic"
          pins = {
              "1476-ci118-remote-diagnostic-acquire.py": "3f0a1c989ee521461626b3e844da6cfe4bc67efbf8661a48b6f8d2989bdf38e0",
              "1476-ci118-remote-diagnostic-reader.py": "9407dcb7890ef678872486eda61ab6a16e0e2a65f8ae60e0ecfe58e34f9113ff",
              "1476-ci118-cpu-reader.py": "a751aee10b5a490235f6c1369a89ed295c3b908c85770bea1cb6c07c690ad458",
              "1476-ci118-cpu-test.py": "298d7adbc61558933d8f719b7e01d16a89c48f0aa932657c722c6f84b1212bc9",
              "1476-ci118-remote-diagnostic-test.py": "7859166951654d6a1ad8725ab8d8def0579b43f9a4772a2c4fcc940a7cd41291",
              "1476-ci118-remote-diagnostic-artifact-metadata.json": "ad1ae221ede54300de425b5a99e5fde495c25e6cc5ea0db3ea6c83cb838000ba",
          }
          for name, expected in pins.items():
              data = (root / name).read_bytes()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit("reviewed helper hash mismatch: " + name)
          metadata = (root / "1476-ci118-remote-diagnostic-artifact-metadata.json").read_bytes()
          destination = Path(os.environ["RUNNER_TEMP"]) / "1476-ci118-capacity-artifact-metadata.json"
          with destination.open("xb") as output:
              if output.write(metadata) != len(metadata):
                  raise SystemExit("short metadata write")
          print(json.dumps({"diagnostic_only": True, "capacity_qualified": False,
                            "independently_rescored": False, "input_sha256": pins,
                            "qualification_source_head": "4556f835e3d4a6f803afc941f4cfcd9cfd7faad1",
                            "accepted_acquirer_source_sha256": "ade9e6a11d79e23873d20238fe104ce6bf4a7b5ebc61b01b518d3c3d8ef30d0c",
                            "scorer_source_sha256": "41f8bd3a1611ae92446f9562a8430805611a5b7121961bccc014f2338f4cfb64",
                            "collector_source_sha256": "773d5e3c9f47c704357ff1669077d02c477c7a13654e1d9a987ad9efa389a699"}, sort_keys=True))
          PY
      - name: Acquire the exact official CI118 capacity artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B -I tools/ci118-diagnostic/1476-ci118-remote-diagnostic-acquire.py
      - name: Read CPU intervals and raw timing without extraction or qualification
        shell: bash
        run: python3 -B -I tools/ci118-diagnostic/1476-ci118-cpu-reader.py
