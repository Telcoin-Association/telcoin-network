name: Consensus liveness on staging

on:
  pull_request:
    branches: ['staging/**']
    paths:
      - 'crates/consensus/primary/**'
      - '.github/workflows/consensus-liveness.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rust-nightly'

permissions:
  contents: read

concurrency:
  group: consensus-liveness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # cache-deps.yaml's six variables: rust-cache hashes them into the key, and this job
    # restores the test-cache entry that cache-deps.yaml warms on main. Keep them, and the
    # toolchains installed before the cache step, in lockstep with that file.
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: "-D warnings -D unused_extern_crates"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install pinned Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      # The runner image's own stable Rust would be hashed into the cache key, so it goes
      # after the last toolchain install and before the cache step (cache-deps.yaml's
      # header says why). The list that follows is the set the key hashes.
      - name: Remove the runner image's Rust
        run: |
          rustup toolchain uninstall stable
          rustup toolchain list
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "false"
      - name: Run quorum regression tests with workspace feature unification
        run: cargo nextest run --locked --workspace --no-fail-fast -E 'package(tn-primary) & test(quorum_)'
      - name: Confirm each new regression test rejects an in-diff mutation
        run: |
          python3 -I -B - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path("crates/consensus/primary/src/consensus")
          # The mutants build under this job's -D warnings, so a replacement keeps every
          # binding, field and method it bypasses referenced: an unused one is a compile
          # error, not a caught mutation.
          mutations = [
              ("liveness.rs", "if self.authors.insert(author.clone()) {",
               "if { let _ = (&self.authors, author); true } {", [
                  "quorum_timeout_deduplicates_authors_polls_and_late_arrivals",
                  "quorum_voting_power_is_unique_author_weight",
                  "quorum_round_state_is_bounded_and_recovery_skips_history",
              ]),
              ("liveness.rs", "< self.committee.quorum_threshold()", "<= self.committee.quorum_threshold()", [
                  "quorum_threshold_and_higher_round_boundary",
                  "quorum_epoch_rollover_and_commit_signal_lifecycle",
              ]),
              ("liveness.rs", ">= QUORUM_OBSERVATION_WINDOW", "> QUORUM_OBSERVATION_WINDOW", [
                  "quorum_deadline_is_fixed_at_first_arrival",
              ]),
              ("liveness.rs", ".max(committed_round)", ".min(committed_round)", [
                  "quorum_recovered_uncommitted_authors_are_not_sampled_again",
              ]),
              ("state.rs", "observer.record_commit();",
               "let _ = RoundQuorumObserver::record_commit; /* mutation: omit commit progress */", [
                  "quorum_loss_and_recovery_through_consensus_driver",
              ]),
          ]
          build = ["cargo", "nextest", "run", "--locked", "--workspace"]
          for filename, before, after, tests in mutations:
              path = root / filename
              original = path.read_text()
              if original.count(before) != 1:
                  raise RuntimeError(f"mutation anchor must occur once: {filename}: {before}")
              try:
                  path.write_text(original.replace(before, after, 1))
                  # A compiler error is not evidence that a regression caught the mutation.
                  subprocess.run(build + ["--no-run"], check=True)
                  for test in tests:
                      print(f"Confirming mutation is rejected by {test}", flush=True)
                      result = subprocess.run(build + [
                          "--no-tests=fail", "-E", f"package(tn-primary) & test({test})",
                      ], check=False)
                      # Nextest distinguishes assertion failures (100) from build errors (101).
                      if result.returncode != 100:
                          raise RuntimeError(f"{test}: expected test failure 100, got {result.returncode}")
              finally:
                  path.write_text(original)
          PY
      # The quorum tests already passed on this tree before the mutations; re-running them rebuilt tn-primary's dependents.
      - name: Verify the mutated files were restored byte for byte
        run: git diff --exit-code -- crates/consensus/primary
