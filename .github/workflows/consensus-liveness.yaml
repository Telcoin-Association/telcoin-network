name: Consensus liveness on staging

on:
  pull_request:
    branches: ['staging/**']
    paths:
      - 'crates/consensus/primary/**'
      - '.github/workflows/consensus-liveness.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rust-nightly'

permissions:
  contents: read

concurrency:
  group: consensus-liveness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> "$GITHUB_ENV"
      - name: Install nightly
        run: rustup toolchain install "$RUST_NIGHTLY" -c clippy,rustfmt,rust-src --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: clippy-cache
          save-if: "false"
      - name: Check formatting and both workspace clippy lanes
        run: |
          ./etc/ci-lanes.sh fmt
          ./etc/ci-lanes.sh clippy

  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install pinned Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "false"
      - name: Run quorum regression tests with workspace feature unification
        run: cargo nextest run --locked --workspace --no-fail-fast -E 'package(tn-primary) & test(quorum_)'
