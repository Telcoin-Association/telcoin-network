# Documentation site (mdBook -> GitHub Pages).
#
# Builds main with the pinned mdBook and publishes it at the site root. There
# are no per-tag builds and no version picker (docs/ux.md, "Publishing").
#
# Triggers: merges into main that touch docs/**, CHANGELOG.md (included by
# docs/src/getting-started/release-notes.md) or this workflow, and
# workflow_dispatch. The "GitHub Actions" Pages source replaces the whole site
# on each deployment.
#
# One-time repo setup: Settings -> Pages -> Source must be set to "GitHub
# Actions" (not "Deploy from a branch"), and the github-pages environment's
# deployment rules must allow deployments from main, the only ref this
# workflow deploys; without either setting, the deploy job fails before
# actions/deploy-pages runs.
#
# Local preview: `make book` (build) or `make book-serve` (live-reload) -- both
# require `cargo install mdbook --version 0.5.4 --locked` to match the version
# pinned below.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

# Building only reads the repository; the deploy job below adds the Pages scopes it
# needs (least privilege, CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# One Pages deployment at a time. Queued runs wait rather than cancel so the newest
# docs merge is never skipped mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build main with the pinned mdBook and hand the site to the deploy job as a
  # Pages artifact.
  # A dispatch runs this file from the ref it was started on, so the `if:` only stops
  # an accidental dispatch from another branch (and skips the deploy job through
  # `needs`). The real control is the github-pages environment's deployment rule,
  # which allows only main; keep it that way.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: mdbook@0.5.4

      - name: Build the site
        run: mdbook build docs --dest-dir "$PWD/site"

      # mdBook only logs a missing include and leaves the raw directive in the
      # page, a missing anchor includes nothing, and a stray anchor line in the
      # included text cuts the page short, so a broken Release notes page still
      # builds. Fail here instead of publishing it: the anchor must be in
      # CHANGELOG.md, the include directive must be gone from the page, and the
      # page must show every CHANGELOG.md section. Commit text that quotes
      # `{{#include` is fine, because only the exact directive is looked for.
      - name: Check the release notes include
        run: |
          page=site/getting-started/release-notes.html
          grep -q 'ANCHOR: releases' CHANGELOG.md || { echo "::error::CHANGELOG.md lacks the releases anchor"; exit 1; }
          if grep -qF '{{#include ../../../CHANGELOG.md:releases}}' "$page"; then echo "::error::the CHANGELOG.md include did not resolve"; exit 1; fi
          want=$(grep -c '^## \[' CHANGELOG.md || true)
          got=$(grep -c '<h2 id="v' "$page" || true)
          [ "$want" = "$got" ] || { echo "::error::the Release notes page shows $got of the $want CHANGELOG.md sections"; exit 1; }

      # Since v4 hidden files (any path component starting with `.`) stay out of the
      # artifact (v5 added `include-hidden-files: true` to keep them), so mdBook's
      # `.nojekyll` is dropped. Nothing needs it: with the Pages source set to "GitHub
      # Actions" the artifact is served as uploaded and no Jekyll build runs, and docs/
      # has no dotfiles of its own.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Publish the artifact to the github-pages environment.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploying writes the Pages deployment and mints the OIDC token that
    # actions/deploy-pages exchanges for it; nothing else is granted.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
