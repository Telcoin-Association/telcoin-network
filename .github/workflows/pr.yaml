# Checks that gate a change into main, on both events that can produce one.
#
#   `pull_request`  -- the PR in isolation, on the author's head commit.
#   `merge_group`   -- the merge queue's temporary commit: main, plus this PR, plus every
#                      PR ahead of it in the batch. This combination has never been
#                      compiled anywhere, which is the whole point: it is where a semantic
#                      merge conflict (both sides green, the merge broken) surfaces.
#
# Every job below reports under the same check name on both events. That matters: GitHub
# evaluates the branch's required checks twice -- once on the PR before it may enter the
# queue, and again on the merge group -- and a required check that never reports on
# `merge_group` does not fail the queue, it hangs it until the queue timeout ejects the PR.
#
# `CI Success` is the single required check. Keep it that way; adding a second required
# name means a second workflow that must also learn `merge_group`. Never add a third
# trigger (`workflow_dispatch`, `push`) to this file either: GitHub matches a required
# check by name on the head sha, whatever event produced it, so a run from another event
# would stand in for the two that gate the branch. `CI Success` fails on an event it does
# not know for the same reason.
#
# The on-chain attestation (`verify-on-chain`) is checked on `pull_request` only. The
# merge group's commit is minted by GitHub seconds before this workflow runs, so no local
# suite can have covered it and nothing can attest it; a lane that required it would hang
# the queue. It gates entry instead: a PR cannot be queued until its head sha is attested,
# and a push to a queued PR removes it from the queue with a new head that is unattested
# until a maintainer runs `make attest` again.
#
# The compile lanes restore their dependency caches and never save them (`save-if:
# "false"`). A cache saved by a pull_request run is scoped to that PR's branch and one
# saved by a merge_group run lands on the queue's throwaway branch, so no other run could
# read either; the upload would only add minutes to the critical path and consume quota
# that evicts the entries the queue does read. Those are written on main by
# .github/workflows/cache-deps.yaml, and the cache steps here must stay in lockstep with
# it: same env block, same steps before the cache step. Its header has the details.
#
# The fmt, clippy and test lanes below do not spell out their own commands. They call
# etc/ci-lanes.sh, which etc/test-and-attest.sh also calls, so what the merge queue
# enforces and what a maintainer attests locally are the same commands by construction
# rather than by inspection. Change a lane there, not here.
name: Pull Request and Merge Queue Checks

on:
  pull_request:
    branches: [main]
    # `review_requested` is load-bearing, not cosmetic: `make attest` writes to adiri and
    # touches nothing on GitHub, so after attesting a maintainer requests a review to
    # re-run `verify-on-chain` on the same sha. A push would mint a new, unattested sha.
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
  # No `branches:` filter here -- on this event the ref is the queue's temporary
  # `gh-readonly-queue/main/...` branch, which a `[main]` filter would not match.
  merge_group:
    types: [checks_requested]

# Cancel superseded runs on a PR. Never on a merge group: those runs are not superseded
# (each tests a distinct candidate commit), and a cancelled run reports as a non-success
# conclusion, which ejects the PR from the queue. `github.head_ref` is empty on
# `merge_group`, so the group's own ref keys the group and each run gets its own slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything here only reads the repository; the attestation lane reads a public RPC and
# needs no secrets (least privilege, CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# Identical to cache-deps.yaml on purpose: every variable here is hashed into the cache key.
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Decides whether the compile-and-test lanes run at all.
  #
  # On a `pull_request` they are skipped for a draft, and for a maintainer-authored PR --
  # a maintainer runs a strictly larger suite locally and attests it (etc/test-and-attest.sh),
  # so re-running a subset of it on GitHub buys nothing.
  #
  # Neither reason survives into the merge queue. The queue's commit is main + this PR,
  # which no local run covered no matter who authored it, so every lane runs there for
  # every author. That is the coverage the attestation cannot provide and the reason the
  # queue is worth having. Note this used to hold only by accident: on `merge_group` the
  # PR-author login is empty, so the maintainer test happened to evaluate false.
  ci-scope:
    name: ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_lanes: ${{ steps.decide.outputs.run_lanes }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "merge queue: running every lane on the merged commit"
            echo "run_lanes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub logins are case-insensitive and the event carries whatever spelling
          # the account currently uses, so compare in lowercase. Keep this list lowercase.
          MAINTAINERS=("grantkee" "sstanfield" "mavenrain" "huwonk")
          run=true
          if [[ " ${MAINTAINERS[*]} " == *" ${PR_AUTHOR,,} "* ]]; then
            echo "maintainer PR (${PR_AUTHOR}): lanes covered by the local attested run"
            run=false
          elif [[ "$PR_DRAFT" == "true" ]]; then
            echo "draft PR: lanes deferred until ready for review"
            run=false
          fi
          echo "run_lanes=${run}" >> "$GITHUB_OUTPUT"

  # The on-chain attestation gate: is this PR's head commit hash in the attestation
  # registry on adiri? A maintainer writes it there with `make attest`, after the full
  # local suite (fmt, clippy, both test lanes, and the e2e suites CI cannot afford) has
  # passed on exactly that commit.
  #
  # `pull_request` only, by design. The merge group's commit did not exist when any local
  # suite ran, so it cannot be attested, and a lane that demanded it would hang the queue
  # until the timeout ejected the PR. Nor does it need checking there: required checks
  # must pass before a PR may enter the queue, so every head that reaches the queue was
  # verified here first, and a push to a queued PR removes it from the queue with a new
  # head this lane has to verify again. `CI Success` accepts this job as `skipped` on
  # `merge_group` and nowhere else.
  #
  # No `environment:` here. The job performs a read-only `cast call` against a public RPC
  # and uses no secrets, and a deployment environment with protection rules attached
  # would park the merge queue on a manual approval until it timed out.
  attest:
    name: verify-on-chain
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # cast, for the read-only registry call
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify attestation on adiri
        env:
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/verify_commit_hash.sh

  # Format check - no compilation needed, finishes in ~30s
  fmt:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c rustfmt --profile minimal

      - name: Check formatting
        run: ./etc/ci-lanes.sh fmt

  # Clippy - replaces cargo check, catches more issues.
  #
  # Two passes, default features and then --all-features (see etc/ci-lanes.sh for why one
  # does not cover the other). The two feature sets unify differently, so each pass
  # compiles its own artifacts; cache-deps.yaml warms both.
  #
  # 45 minutes is a ceiling, not the budget. Warm, the --all-features pass compiled in 20 s
  # on main (checkout with submodules ~80 s, restore ~20 s), so expect a few minutes. The
  # ceiling covers the window after a heavy dependency bump before cache-deps has
  # re-warmed: 11.5 min measured for one pass with a partial cache. A lane anywhere near
  # 45 min means the cache is broken, not that the build is slow.
  clippy:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # Before the cache step: RUST_NIGHTLY is part of the cache key (rust-cache hashes
      # every CARGO*/RUST* variable in the environment), and cache-deps.yaml sets it at
      # the same point.
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c clippy,rust-src --profile minimal

      # Restore only; cache-deps.yaml writes the entries on main (see the header). The
      # `prefix-key` deliberately still defaults to v0-rust: the v1-rust entries cache-deps
      # now writes do not exist until it has run on main, and a fully cold queue run would
      # hit the timeout. Flip all three cache steps to `prefix-key: v1-rust` in a follow-up
      # once it has (see .github/ACTIONS.md, "Caches").
      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: clippy-cache
          save-if: "false"

      - name: Run clippy
        run: ./etc/ci-lanes.sh clippy

  # Tests - compile and run with nextest for parallel execution.
  #
  # 45 minutes is a ceiling, not the budget. Warm, every workspace test binary built in
  # 1 m 48 s on main. The suite's own run time on a GitHub runner is unmeasured (every
  # recent PR was maintainer-authored and skipped this lane), and the ceiling also covers
  # a cold dependency build after a heavy bump: 9.5 min measured with a partial cache.
  test:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Restore only; see the clippy job.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: test-cache
          save-if: "false"

      # Resolves the dependency graph only (compiles nothing; seconds, with the registry
      # index restored above). The script says why rocksdb must stay out of the default
      # graph. It runs inside this job to reuse the restored cargo home instead of cloning
      # reth's git repository again in a job of its own.
      - name: Assert rocksdb absent from the default feature graph
        run: ./etc/rocksdb-gate.sh

      - name: Run tests
        # `ci` profile: retries = 2, so a flake is less likely to eject a PR from the
        # queue and force a rebuild of everything behind it. See etc/ci-lanes.sh.
        env:
          NEXTEST_PROFILE: ci
        run: ./etc/ci-lanes.sh test-default

  # Adiri feature lane: the adiri-gated suites only compile under the adiri features, so
  # the default-feature test job above never builds or runs them. The package and feature
  # list lives in etc/ci-lanes.sh, next to the note on which packages are deliberately
  # left off it. Same 45-minute ceiling as `test`, for the same reasons.
  adiri-test:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Restore only (see the clippy job), from the same entry as `test`: cache-deps builds
      # both test lanes into one target dir, where the adiri variants of the shared
      # dependencies coexist with the default ones.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: test-cache
          save-if: "false"

      - name: Run adiri-gated tests
        env:
          NEXTEST_PROFILE: ci
        run: ./etc/ci-lanes.sh test-adiri

  # Guard: pinned consensus-registry reads (committee membership, epoch records, epoch state,
  # worker fee configs) resolve historical state through `state_by_block_hash`, which reth fails
  # with StateAtBlockPruned once that history is pruned - mid-consensus, not at startup.
  # `RethConfig::ensure_archive_mode` rejects a pruning CONFIGURATION at startup; this catches a
  # pruner wired straight against the provider, or a reth.toml `[prune]` section reth would merge
  # behind `NodeConfig::prune_config`.
  # Greps only - nothing is resolved or compiled, so no toolchain or cache is needed.
  archive-mode-gate:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assert no pruning entry point in the node
        run: ./etc/archive-mode-guard.sh

  # The one required status check, for branch protection and for the merge queue.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [ci-scope, attest, fmt, clippy, test, adiri-test, archive-mode-gate]
    steps:
      - name: Check all jobs passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Allowlist, not blocklist: every (event, job, result) triple is either named
          # below as acceptable or fails. The blocklist this replaces let `cancelled` and
          # any future conclusion through, greening the gate on a job that never produced
          # a result.
          #
          # Every jq call is a plain assignment, so unparseable RESULTS fails the step
          # under set -e. The old loop read from a process substitution, whose exit status
          # is discarded, and malformed input printed "All checks passed".
          case "${EVENT_NAME}" in
            pull_request|merge_group) ;;
            *)
              echo "::error::CI Success does not know the '${EVENT_NAME}' event; only pull_request and merge_group gate main"
              exit 1
              ;;
          esac

          # The job list is asserted, not discovered: a job renamed or dropped from
          # `needs` would otherwise leave this check silently, or turn up as an unnamed
          # lane whose `skipped` the pull_request branch below accepts.
          expected="adiri-test archive-mode-gate attest ci-scope clippy fmt test"
          actual=$(jq -r 'keys | join(" ")' <<<"${RESULTS}")
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::needs mismatch: expected [${expected}], got [${actual}]. Update 'expected' in this step together with 'needs'."
            exit 1
          fi

          run_lanes=$(jq -r '."ci-scope".outputs.run_lanes // ""' <<<"${RESULTS}")
          rows=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"${RESULTS}")

          failed=0
          while read -r job result; do
            case "${EVENT_NAME}:${job}:${result}" in
              # ci-scope decides whether the lanes ran; nothing below can be trusted if it
              # did not itself succeed.
              *:ci-scope:success) echo "  ok       ${job}" ;;
              *:ci-scope:*)
                echo "::error::ci-scope: ${result}"
                failed=1
                ;;
              # The attestation runs on the pull request only (see the attest job): it
              # must succeed there, and must not have run in the queue.
              pull_request:attest:success) echo "  ok       ${job}" ;;
              merge_group:attest:skipped) echo "  skipped  ${job} (verified at queue entry)" ;;
              *:attest:*)
                echo "::error::attest: ${result} on ${EVENT_NAME}"
                failed=1
                ;;
              *:*:success) echo "  ok       ${job}" ;;
              # A skipped lane is the maintainer/draft bypass and nothing else: ci-scope
              # must have said the lanes were not to run. In the queue nothing may be
              # skipped -- a skipped lane there means the merged commit went untested,
              # which is the one thing the queue exists to prevent.
              pull_request:*:skipped)
                if [[ "${run_lanes}" == "false" ]]; then
                  echo "  skipped  ${job} (ci-scope: covered by the attested local run)"
                else
                  echo "::error::${job} was skipped although ci-scope asked for the lanes to run"
                  failed=1
                fi
                ;;
              *)
                echo "::error::${job}: ${result} on ${EVENT_NAME}"
                failed=1
                ;;
            esac
          done <<<"${rows}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
