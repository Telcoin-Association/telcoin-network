# Checks that gate a change into main, on both events that can produce one.
#
#   `pull_request`  -- the PR in isolation, on the author's head commit.
#   `merge_group`   -- the merge queue's temporary commit: main, plus this PR, plus every
#                      PR ahead of it in the batch. This combination has never been
#                      compiled anywhere, which is the whole point: it is where a semantic
#                      merge conflict (both sides green, the merge broken) surfaces.
#
# Every job below reports under the same check name on both events. That matters: GitHub
# evaluates the branch's required checks twice -- once on the PR before it may enter the
# queue, and again on the merge group -- and a required check that never reports on
# `merge_group` does not fail the queue, it hangs it until the queue timeout ejects the PR.
#
# `CI Success` is the single required check. Keep it that way; adding a second required
# name means a second workflow that must also learn `merge_group`. Never add a third
# trigger (`workflow_dispatch`, `push`) to this file either: GitHub matches a required
# check by name on the head sha, whatever event produced it, so a run from another event
# would stand in for the two that gate the branch. `CI Success` fails on an event it does
# not know for the same reason.
#
# The on-chain attestation (`verify-on-chain`) is checked on `pull_request` only. The
# merge group's commit is minted by GitHub seconds before this workflow runs, so no local
# suite can have covered it and nothing can attest it; a lane that required it would hang
# the queue. It gates entry instead: a PR cannot be queued until its head sha is attested,
# and a push to a queued PR removes it from the queue with a new head that is unattested
# until a maintainer runs `make attest` again. That holds for a PR that leaves the gate
# alone; the `attest` job below says what stops a PR that edits it.
#
# The compile lanes restore their dependency caches and never save them (`save-if:
# "false"`). A cache saved by a pull_request run is scoped to that PR's branch and one
# saved by a merge_group run lands on the queue's throwaway branch, so no other run could
# read either; the upload would only add minutes to the critical path and consume quota
# that evicts the entries the queue does read. Those are written on main by
# .github/workflows/cache-deps.yaml, and the cache steps here must stay in lockstep with
# it: same env block, same steps before the cache step, same rust-cache release. A release
# that changes the key moves in both files in one pull request, and the queue builds cold
# until main has re-warmed; cache-deps.yaml's header says why it cannot move there first.
#
# The fmt, clippy and test lanes below do not spell out their own commands. They call
# etc/ci-lanes.sh, which etc/test-and-attest.sh also calls, so what the merge queue
# enforces and what a maintainer attests locally are the same commands by construction
# rather than by inspection. Change a lane there, not here.
#
# Every action the workflows use is pinned to a full commit SHA, with the release it
# stands for in a trailing comment on the same line. A tag such as `v4` can be repointed
# upstream, and the gate would then run new code with no change in this repository.
# Dependabot proposes the bumps (.github/dependabot.yaml); the procedure is in
# .github/ACTIONS.md, under "Action pins".
name: Pull Request and Merge Queue Checks

on:
  pull_request:
    branches: [main]
    # `review_requested` is load-bearing, not cosmetic: `make attest` writes to adiri and
    # touches nothing on GitHub, so after attesting a maintainer requests a review to
    # re-run `verify-on-chain` on the same sha. A push would mint a new, unattested sha.
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
  # No `branches:` filter here -- on this event the ref is the queue's temporary
  # `gh-readonly-queue/main/...` branch, which a `[main]` filter would not match.
  merge_group:
    types: [checks_requested]

# Cancel superseded runs on a PR. Never on a merge group: those runs are not superseded
# (each tests a distinct candidate commit), and a cancelled run reports as a non-success
# conclusion, which ejects the PR from the queue. `github.head_ref` is empty on
# `merge_group`, so the group's own ref keys the group and each run gets its own slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything here only reads the repository; the attestation lane reads a public RPC and
# needs no secrets (least privilege, CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

# Identical to cache-deps.yaml on purpose: every variable here is hashed into the cache key.
env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Decides whether the compile-and-test lanes run at all.
  #
  # On a `pull_request` they are skipped for a draft, and for a maintainer-authored PR --
  # a maintainer runs a strictly larger suite locally and attests it (etc/test-and-attest.sh),
  # so re-running a subset of it on GitHub buys nothing.
  #
  # Neither reason survives into the merge queue. The queue's commit is main + this PR,
  # which no local run covered no matter who authored it, so every lane runs there for
  # every author. That is the coverage the attestation cannot provide and the reason the
  # queue is worth having. Note this used to hold only by accident: on `merge_group` the
  # PR-author login is empty, so the maintainer test happened to evaluate false.
  ci-scope:
    name: ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_lanes: ${{ steps.decide.outputs.run_lanes }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "merge queue: running every lane on the merged commit"
            echo "run_lanes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub logins are case-insensitive and the event carries whatever spelling
          # the account currently uses, so compare in lowercase. Keep this list lowercase.
          MAINTAINERS=("grantkee" "sstanfield" "mavenrain" "huwonk")
          run=true
          if [[ " ${MAINTAINERS[*]} " == *" ${PR_AUTHOR,,} "* ]]; then
            echo "maintainer PR (${PR_AUTHOR}): lanes covered by the local attested run"
            run=false
          elif [[ "$PR_DRAFT" == "true" ]]; then
            echo "draft PR: lanes deferred until ready for review"
            run=false
          fi
          echo "run_lanes=${run}" >> "$GITHUB_OUTPUT"

  # The on-chain attestation gate: is this PR's head commit hash in the attestation
  # registry on adiri? A maintainer writes it there with `make attest`, after the full
  # local suite (fmt, clippy, both test lanes, and the e2e suites CI cannot afford) has
  # passed on exactly that commit.
  #
  # `pull_request` only, by design. The merge group's commit did not exist when any local
  # suite ran, so it cannot be attested, and a lane that demanded it would hang the queue
  # until the timeout ejected the PR. Nor does it need checking there: required checks
  # must pass before a PR may enter the queue, so every head that reaches the queue was
  # verified here first, and a push to a queued PR removes it from the queue with a new
  # head this lane has to verify again. `CI Success` accepts this job as `skipped` on
  # `merge_group` and nowhere else.
  #
  # No `environment:` here. The job performs a read-only `cast call` against a public RPC
  # and uses no secrets, and a deployment environment with protection rules attached
  # would park the merge queue on a manual approval until it timed out.
  attest:
    name: verify-on-chain
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The script comes from main as it stands when this job starts, checked out into
      # `trusted/`, and the PR's own tree is never checked out in this job. A bare
      # checkout on `pull_request` is the PR's merge commit, so the script judging the PR
      # would be supplied by the PR: an `exit 0` or a different CONTRACT_ADDRESS would
      # turn this check green with no attestation. main moves only through the ruleset or
      # an admin bypassing it, so the author cannot choose what is checked out here, nor
      # keep an old copy by not pushing, as `pull_request.base.sha` would allow: that does
      # not follow main, and neither a review request nor a re-run moves it.
      #
      # The ref is spelled `refs/heads/main`, fully qualified so that a tag named `main`
      # cannot be picked up, rather than taken from `github.base_ref` or
      # `pull_request.base.ref`: the trigger only accepts PRs into main today, and a
      # literal stays main if that filter is ever widened, so no PR can have the script
      # read from a branch its author can push to.
      #
      # The consequence to expect: a PR that changes verify_commit_hash.sh is judged by
      # the old script, and every run after it lands uses the new one, on every open PR.
      #
      # What this does not cover: the job definition below and the `CI Success` allowlist
      # still come from the PR's merge commit, and a PR can edit those instead. Such a PR
      # is stopped by the required code-owner review (.github/CODEOWNERS), not here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          path: trusted
          sparse-checkout: .github/scripts
          persist-credentials: false

      # This step supplies `cast` for the read-only registry call, whose answer decides
      # this check. No action installs it. The step downloads the release archive itself
      # and checks its SHA-256 against FOUNDRY_SHA256 before extracting anything, so
      # nothing from upstream is unpacked or run before that check; `cast --version` on the
      # last line is the first time anything from the archive runs. curl, tar and
      # sha256sum are the runner image's own, since no step before this one adds to PATH;
      # the image is trusted and not pinned.
      #
      # foundry-rs/foundry-toolchain is not used because it takes no digest. It runs
      # foundryup, itself fetched unpinned at its latest release, which unpacks the Foundry
      # release and executes every binary in it with `-V`; the action then runs each with
      # `--version` too. All of that happens before a later step could check anything, so
      # a check after that install could gate only the registry call, not those executions.
      #
      # A release asset replaced under the same tag, or the tag re-pointed, fails this step
      # instead of answering the registry call. The digest is that of the linux_amd64
      # archive, because ubuntu-latest is x64; another runner architecture needs another
      # archive and digest. `forge` comes from the same verified archive although nothing
      # here runs it today, so a step that needs it later inherits this pin instead of
      # installing a Foundry of its own.
      #
      # FOUNDRY_VERSION and FOUNDRY_SHA256 move together, by hand: there is no action here
      # for Dependabot to bump, and .github/ACTIONS.md ("What a pin does not cover") has the
      # procedure. Both are part of this job definition, which the PR supplies, so they
      # guard against a change upstream and not against a PR that edits them; the comment
      # above the checkout says what stops that.
      - name: Install Foundry
        env:
          FOUNDRY_VERSION: v1.8.3
          FOUNDRY_SHA256: 7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568
        run: |
          set -euo pipefail
          archive="foundry_${FOUNDRY_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${archive}"
          echo "${FOUNDRY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/foundry"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/foundry" cast forge
          echo "${RUNNER_TEMP}/foundry" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/foundry/cast" --version

      - name: Verify attestation on adiri
        env:
          COMMIT_HASH: ${{ github.event.pull_request.head.sha }}
        run: trusted/.github/scripts/verify_commit_hash.sh

  # Format check - no compilation needed, finishes in ~30s
  fmt:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c rustfmt --profile minimal

      - name: Check formatting
        run: ./etc/ci-lanes.sh fmt

  # This carried dependency is outside the workspace, so workspace test lanes do not
  # exercise its accounting regressions. Run them for maintainer PRs as well.
  connection-limits-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain
        run: rustup toolchain install 1.94 --profile minimal --component clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: connection-limits-patch

      - name: Test connection accounting
        run: cargo +1.94 test --locked -p libp2p-connection-limits --lib

      - name: Test carried Kademlia application filtering patch
        run: cargo +1.94 test --locked --manifest-path patches/libp2p-kad/Cargo.toml --lib

  # Capacity instrumentation needs executable validation even before a live run is available.
  # Keep this lane independent of draft/maintainer deferral, with a finite source scope.
  hub-capacity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      qualification_required: ${{ steps.scope.outputs.changed }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Detect capacity source changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "${BASE_SHA}" HEAD -- .github/workflows/pr.yaml tools/hub-capacity bin/node-record-api crates/config/src crates/network-libp2p/src crates/consensus/primary/src/network crates/consensus/worker/src/network crates/node/src/manager/node.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pinned Rust toolchain
        if: steps.scope.outputs.changed == 'true'
        run: rustup toolchain install 1.94 --profile minimal --component clippy

      - name: Install cargo-nextest
        if: steps.scope.outputs.changed == 'true'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      - name: Restore test dependencies
        if: steps.scope.outputs.changed == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "false"

      - name: Test capacity evidence tools
        if: steps.scope.outputs.changed == 'true'
        run: python3 -B -I -m unittest discover -s tools/hub-capacity -p 'test_*.py'

      - name: Compile the pinned workspace closure
        if: steps.scope.outputs.changed == 'true'
        run: cargo +1.94 test --locked --workspace --no-run

      - name: Build Linux qualification binaries
        if: steps.scope.outputs.changed == 'true'
        run: |
          cargo +1.94 build --locked -p telcoin-network -p tn-node-record-api
          cargo +1.94 build --locked -p tn-node-record-api --example hub-capacity-peer
          cargo +1.94 test --locked -p tn-node-record-api --example hub-capacity-peer
          git rev-parse HEAD > target/debug/hub-capacity-revision.txt
          sha256sum target/debug/telcoin-network target/debug/node-record-api target/debug/examples/hub-capacity-peer > target/debug/hub-capacity-binaries.sha256

      - name: Retain Linux qualification binaries
        if: steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-capacity-linux-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            target/debug/telcoin-network
            target/debug/node-record-api
            target/debug/examples/hub-capacity-peer
            target/debug/hub-capacity-revision.txt
            target/debug/hub-capacity-binaries.sha256

      - name: Test capacity integration and cancellation
        if: steps.scope.outputs.changed == 'true'
        run: cargo +1.94 nextest run --locked --workspace --exclude tn-faucet

      - name: Check the pinned workspace with Clippy
        if: steps.scope.outputs.changed == 'true'
        run: cargo +1.94 clippy --locked --workspace --all-targets --keep-going -- -D warnings

      - name: Confirm compiling Rust mutations
        if: steps.scope.outputs.changed == 'true'
        run: python3 -B -I tools/hub-capacity/mutate-rust.py --output target/debug/hub-capacity-mutations

      - name: Retain mutation diagnostics
        if: always() && steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-capacity-mutations-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: target/debug/hub-capacity-mutations

  # A measured qualification is required whenever the capacity source scope changes.
  hub-capacity-qualification:
    needs: hub-capacity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.hub-capacity.outputs.qualification_required == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download attested qualification binaries
        if: needs.hub-capacity.outputs.qualification_required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hub-capacity-linux-arm64-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/hub-capacity-binaries

      - name: Install offline transaction signer
        if: needs.hub-capacity.outputs.qualification_required == 'true'
        env:
          FOUNDRY_VERSION: v1.8.3
          FOUNDRY_SHA256: 93fc23be26c8a902ca58fe54aa6ca28c880b58af95d052674933161df7928e6d
        run: |
          set -euo pipefail
          archive="foundry_${FOUNDRY_VERSION}_linux_arm64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/foundry-rs/foundry/releases/download/${FOUNDRY_VERSION}/${archive}"
          echo "${FOUNDRY_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir "${RUNNER_TEMP}/capacity-foundry"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/capacity-foundry" cast anvil
          echo "${RUNNER_TEMP}/capacity-foundry" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/capacity-foundry/cast" --version
          "${RUNNER_TEMP}/capacity-foundry/anvil" --version

      - name: Build isolated Linux runtime
        if: needs.hub-capacity.outputs.qualification_required == 'true'
        run: docker build -f tools/hub-capacity/Dockerfile -t tn-capacity-1476-runtime:ubuntu24 tools/hub-capacity

      - name: Qualify the declared population and resource envelope
        if: needs.hub-capacity.outputs.qualification_required == 'true'
        env:
          HUB_CAPACITY_BINARIES: ${{ runner.temp }}/hub-capacity-binaries
          HUB_CAPACITY_EVIDENCE: ${{ runner.temp }}/hub-capacity-qualification
        run: python3 -B -I tools/hub-capacity/docker-run.py --binaries "$HUB_CAPACITY_BINARIES" --output "$HUB_CAPACITY_EVIDENCE" --runner-envelope github-actions

      - name: Retain qualification evidence and diagnostics
        if: always() && needs.hub-capacity.outputs.qualification_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-capacity-evidence-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hub-capacity-qualification/*.json
            ${{ runner.temp }}/hub-capacity-qualification/*-docker-exec.log
            ${{ runner.temp }}/hub-capacity-qualification/source
            ${{ runner.temp }}/hub-capacity-qualification/*-evidence
            ${{ runner.temp }}/hub-capacity-qualification/deployment/*/*.json
            ${{ runner.temp }}/hub-capacity-qualification/deployment/*/*.jsonl
            ${{ runner.temp }}/hub-capacity-qualification/deployment/*/*-process-*.log
            ${{ runner.temp }}/hub-capacity-qualification/deployment/*/peers/*.json
            ${{ runner.temp }}/hub-capacity-qualification/deployment/population.json

  # Clippy - replaces cargo check, catches more issues.
  #
  # Two passes, default features and then --all-features (see etc/ci-lanes.sh for why one
  # does not cover the other). The two feature sets unify differently, so each pass
  # compiles its own artifacts; cache-deps.yaml warms both.
  #
  # 45 minutes is a ceiling, not the budget. Warm, the --all-features pass compiled in 20 s
  # on main (checkout with submodules ~80 s, restore ~20 s), so expect a few minutes. The
  # ceiling covers the window after a heavy dependency bump before cache-deps has
  # re-warmed: 11.5 min measured for one pass with a partial cache. A lane anywhere near
  # 45 min means the cache is broken, not that the build is slow.
  clippy:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      # Before the cache step: RUST_NIGHTLY is part of the cache key (rust-cache hashes
      # every CARGO*/RUST* variable in the environment), and cache-deps.yaml sets it at
      # the same point.
      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c clippy,rust-src --profile minimal

      # Restore only; cache-deps.yaml writes the v1-rust entries on main.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: clippy-cache
          save-if: "false"

      - name: Run clippy
        run: ./etc/ci-lanes.sh clippy

  # Tests - compile and run with nextest for parallel execution.
  #
  # 45 minutes is a ceiling, not the budget. Warm, every workspace test binary built in
  # 1 m 48 s on main. The suite's own run time on a GitHub runner is unmeasured (every
  # recent PR was maintainer-authored and skipped this lane), and the ceiling also covers
  # a cold dependency build after a heavy bump: 9.5 min measured with a partial cache.
  test:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      # Restore only; see the clippy job.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "false"

      # Resolves the dependency graph only (compiles nothing; seconds, with the registry
      # index restored above). The script says why rocksdb must stay out of the default
      # graph. It runs inside this job to reuse the restored cargo home instead of cloning
      # reth's git repository again in a job of its own.
      - name: Assert rocksdb absent from the default feature graph
        run: ./etc/rocksdb-gate.sh

      - name: Run tests
        # `ci` profile: retries = 2, so a flake is less likely to eject a PR from the
        # queue and force a rebuild of everything behind it. See etc/ci-lanes.sh.
        env:
          NEXTEST_PROFILE: ci
        run: ./etc/ci-lanes.sh test-default

  # Adiri feature lane: the adiri-gated suites only compile under the adiri features, so
  # the default-feature test job above never builds or runs them. The package and feature
  # list lives in etc/ci-lanes.sh, next to the note on which packages are deliberately
  # left off it. Same 45-minute ceiling as `test`, for the same reasons.
  adiri-test:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest

      # Restore only (see the clippy job), from the same entry as `test`: cache-deps builds
      # both test lanes into one target dir, where the adiri variants of the shared
      # dependencies coexist with the default ones.
      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: test-cache
          save-if: "false"

      - name: Run adiri-gated tests
        env:
          NEXTEST_PROFILE: ci
        run: ./etc/ci-lanes.sh test-adiri

  # Guard: pinned consensus-registry reads (committee membership, epoch records, epoch state,
  # worker fee configs) resolve historical state through `state_by_block_hash`, which reth fails
  # with StateAtBlockPruned once that history is pruned - mid-consensus, not at startup.
  # `RethConfig::ensure_archive_mode` rejects a pruning CONFIGURATION at startup; this catches a
  # pruner wired straight against the provider, or a reth.toml `[prune]` section reth would merge
  # behind `NodeConfig::prune_config`.
  # Greps only - nothing is resolved or compiled, so no toolchain or cache is needed.
  archive-mode-gate:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert no pruning entry point in the node
        run: ./etc/archive-mode-guard.sh

  # Transport evidence also runs for maintainer and draft PRs. Scope is evaluated inside
  # the workflow, so unrelated changes succeed without compiling the peer fixtures.
  transport-evidence:
    uses: ./.github/workflows/transport-patches.yaml

  # The one required status check, for branch protection and for the merge queue.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [ci-scope, attest, fmt, clippy, test, adiri-test, archive-mode-gate, connection-limits-patch, hub-capacity, hub-capacity-qualification, transport-evidence]
    steps:
      - name: Check all jobs passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Allowlist, not blocklist: every (event, job, result) triple is either named
          # below as acceptable or fails. The blocklist this replaces let `cancelled` and
          # any future conclusion through, greening the gate on a job that never produced
          # a result.
          #
          # Every jq call is a plain assignment, so unparseable RESULTS fails the step
          # under set -e. The old loop read from a process substitution, whose exit status
          # is discarded, and malformed input printed "All checks passed".
          case "${EVENT_NAME}" in
            pull_request|merge_group) ;;
            *)
              echo "::error::CI Success does not know the '${EVENT_NAME}' event; only pull_request and merge_group gate main"
              exit 1
              ;;
          esac

          # The job list is asserted, not discovered: a job renamed or dropped from
          # `needs` would otherwise leave this check silently, or turn up as an unnamed
          # lane whose `skipped` the pull_request branch below accepts.
          expected="adiri-test archive-mode-gate attest ci-scope clippy connection-limits-patch fmt hub-capacity hub-capacity-qualification test transport-evidence"
          actual=$(jq -r 'keys | join(" ")' <<<"${RESULTS}")
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::needs mismatch: expected [${expected}], got [${actual}]. Update 'expected' in this step together with 'needs'."
            exit 1
          fi

          run_lanes=$(jq -r '."ci-scope".outputs.run_lanes // ""' <<<"${RESULTS}")
          rows=$(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"${RESULTS}")

          failed=0
          while read -r job result; do
            case "${EVENT_NAME}:${job}:${result}" in
              # ci-scope decides whether the lanes ran; nothing below can be trusted if it
              # did not itself succeed.
              *:ci-scope:success) echo "  ok       ${job}" ;;
              *:ci-scope:*)
                echo "::error::ci-scope: ${result}"
                failed=1
                ;;
              # The attestation runs on the pull request only (see the attest job): it
              # must succeed there, and must not have run in the queue.
              pull_request:attest:success) echo "  ok       ${job}" ;;
              merge_group:attest:skipped) echo "  skipped  ${job} (verified at queue entry)" ;;
              *:attest:*)
                echo "::error::attest: ${result} on ${EVENT_NAME}"
                failed=1
                ;;
              *:connection-limits-patch:success|*:hub-capacity:success|*:hub-capacity-qualification:success|*:transport-evidence:success) echo "  ok       ${job}" ;;
              *:connection-limits-patch:*|*:hub-capacity:*|*:hub-capacity-qualification:*|*:transport-evidence:*)
                echo "::error::${job}: ${result}"
                failed=1
                ;;
              *:*:success) echo "  ok       ${job}" ;;
              # A skipped lane is the maintainer/draft bypass and nothing else: ci-scope
              # must have said the lanes were not to run. In the queue nothing may be
              # skipped -- a skipped lane there means the merged commit went untested,
              # which is the one thing the queue exists to prevent.
              pull_request:*:skipped)
                if [[ "${run_lanes}" == "false" ]]; then
                  echo "  skipped  ${job} (ci-scope: covered by the attested local run)"
                else
                  echo "::error::${job} was skipped although ci-scope asked for the lanes to run"
                  failed=1
                fi
                ;;
              *)
                echo "::error::${job}: ${result} on ${EVENT_NAME}"
                failed=1
                ;;
            esac
          done <<<"${rows}"

          if [[ "${failed}" -ne 0 ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
