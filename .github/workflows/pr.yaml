# Checks that gate a change into main, on both events that can produce one.
#
#   `pull_request`  -- the PR in isolation, on the author's head commit.
#   `merge_group`   -- the merge queue's temporary commit: main, plus this PR, plus every
#                      PR ahead of it in the batch. This combination has never been
#                      compiled anywhere, which is the whole point: it is where a semantic
#                      merge conflict (both sides green, the merge broken) surfaces.
#
# Every job below reports under the same check name on both events. That matters: GitHub
# evaluates the branch's required checks twice -- once on the PR before it may enter the
# queue, and again on the merge group -- and a required check that never reports on
# `merge_group` does not fail the queue, it hangs it until the queue timeout ejects the PR.
#
# `CI Success` is the single required check. Keep it that way; adding a second required
# name means a second workflow that must also learn `merge_group`.
name: Pull Request and Merge Queue Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, review_requested, ready_for_review]
  # No `branches:` filter here -- on this event the ref is the queue's temporary
  # `gh-readonly-queue/main/...` branch, which a `[main]` filter would not match.
  merge_group:
    types: [checks_requested]

# Cancel superseded runs on a PR. Never on a merge group: those runs are not superseded
# (each tests a distinct candidate commit), and a cancelled run reports as a non-success
# conclusion, which ejects the PR from the queue. `github.head_ref` is empty on
# `merge_group`, so the group's own ref keys the group and each run gets its own slot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.merge_group.head_ref || github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Everything here only reads the repository; the attestation lane reads a public RPC and
# needs no secrets (least privilege, CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings -D unused_extern_crates"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Decides whether the compile-and-test lanes run at all.
  #
  # On a `pull_request` they are skipped for a draft, and for a maintainer-authored PR --
  # a maintainer runs a strictly larger suite locally and attests it (etc/test-and-attest.sh),
  # so re-running a subset of it on GitHub buys nothing.
  #
  # Neither reason survives into the merge queue. The queue's commit is main + this PR,
  # which no local run covered no matter who authored it, so every lane runs there for
  # every author. That is the coverage the attestation cannot provide and the reason the
  # queue is worth having. Note this used to hold only by accident: on `merge_group` the
  # PR-author login is empty, so the maintainer test happened to evaluate false.
  ci-scope:
    name: ci-scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_lanes: ${{ steps.decide.outputs.run_lanes }}
    steps:
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "merge queue: running every lane on the merged commit"
            echo "run_lanes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAINTAINERS=("grantkee" "sstanfield" "MavenRain" "Huwonk")
          run=true
          if [[ " ${MAINTAINERS[*]} " == *" ${PR_AUTHOR} "* ]]; then
            echo "maintainer PR (${PR_AUTHOR}): lanes covered by the local attested run"
            run=false
          elif [[ "$PR_DRAFT" == "true" ]]; then
            echo "draft PR: lanes deferred until ready for review"
            run=false
          fi
          echo "run_lanes=${run}" >> "$GITHUB_OUTPUT"

  # The on-chain attestation gate. Always runs, on both events; the script picks which
  # commit hash(es) the event makes verifiable. See .github/scripts/verify_attestation.sh.
  #
  # This lane deliberately carries no `environment:`. It performs a read-only `cast call`
  # against a public RPC and uses no secrets, and a deployment environment with protection
  # rules attached would park the merge queue on a manual approval until it times out.
  attest:
    name: verify-on-chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history on `merge_group` so the group's first-parent chain back to base_sha
      # is walkable; the PR event needs no history at all. GitHub expressions treat 0 as
      # falsy, hence the quoted strings.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}

      # install foundry toolchain for casting txs
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify attestation on adiri
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: .github/scripts/verify_attestation.sh

  # Format check - no compilation needed, finishes in ~30s
  fmt:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c rustfmt --profile minimal

      - name: Check formatting
        run: cargo +$RUST_NIGHTLY fmt --all -- --check

  # Clippy - replaces cargo check, catches more issues
  clippy:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Read nightly version
        run: echo "RUST_NIGHTLY=$(cat rust-nightly)" >> $GITHUB_ENV

      - name: Install nightly toolchain
        run: rustup toolchain install $RUST_NIGHTLY -c clippy,rust-src --profile minimal

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: clippy-cache
          cache-on-failure: "true"

      - name: Run clippy
        run: cargo +$RUST_NIGHTLY clippy --locked --all --all-features -- -D warnings

  # Tests - compile and run with nextest for parallel execution
  test:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: test-cache
          cache-on-failure: "true"

      - name: Run tests
        run: cargo nextest run --locked --workspace --exclude tn-faucet --no-fail-fast --profile ci

  # Adiri feature lane: the adiri-gated suites only compile under the adiri features, so
  # the default-feature test job above never builds or runs them - the legacy header
  # wire-format pins and the frozen pre-fork committee vectors in tn-types, the
  # consensus-registry fork tests in tn-reth, the pre-fork entry-fee pin in tn-node, the
  # frozen pre-fork consensus-pack fixtures in tn-storage, and the pre-fork genesis
  # rejection in tn-config. Every crate that forwards `adiri` and has adiri-gated tests
  # belongs on this line: one left off silently stops testing its pre-fork lane.
  adiri-test:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: adiri-test-cache
          cache-on-failure: "true"

      - name: Run adiri-gated tests
        run: cargo nextest run --locked -p tn-types -p tn-reth -p tn-node -p tn-storage -p tn-config --features tn-types/adiri,tn-reth/adiri,tn-reth/test-utils,tn-node/adiri,tn-storage/adiri,tn-config/adiri --no-fail-fast --profile ci

  # Guard: rocksdb (librocksdb-sys, the entire RocksDB C++ engine and the single largest
  # native compile in the tree) must stay out of the default feature graph. It is gated
  # behind the off-by-default `rocksdb` feature; this catches a future reth bump whose
  # default set silently re-introduces it. Resolves the graph only - nothing is compiled.
  rocksdb-gate:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3
        with:
          shared-key: rocksdb-gate-cache
          cache-on-failure: "true"

      - name: Assert rocksdb absent from default feature graph
        run: |
          # Structured check: count rocksdb packages in the feature-resolved metadata
          # graph instead of scraping cargo's error wording. A cargo/jq failure fails
          # the assignment (bash -e -o pipefail), so infrastructure errors fail closed.
          hits=$(cargo metadata --locked --format-version 1 \
            | jq '[.resolve.nodes[].id | select(test("[/#]rocksdb@"))] | length')
          if [[ "$hits" -ne 0 ]]; then
            echo "librocksdb-sys re-entered the default dependency graph ($hits rocksdb package(s) resolved):"
            cargo tree --locked -e features -i rocksdb || true
            exit 1
          fi
          echo "rocksdb absent from the default feature graph"

  # Guard: pinned consensus-registry reads (committee membership, epoch records, epoch state,
  # worker fee configs) resolve historical state through `state_by_block_hash`, which reth fails
  # with StateAtBlockPruned once that history is pruned - mid-consensus, not at startup.
  # `RethConfig::ensure_archive_mode` rejects a pruning CONFIGURATION at startup; this catches a
  # pruner wired straight against the provider, or a reth.toml `[prune]` section reth would merge
  # behind `NodeConfig::prune_config`.
  # Greps only - nothing is resolved or compiled, so no toolchain or cache is needed.
  archive-mode-gate:
    needs: ci-scope
    if: needs.ci-scope.outputs.run_lanes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assert no pruning entry point in the node
        run: ./etc/archive-mode-guard.sh

  # The one required status check, for branch protection and for the merge queue.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [ci-scope, attest, fmt, clippy, test, adiri-test, rocksdb-gate, archive-mode-gate]
    steps:
      - name: Check all jobs passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # Allowlist the acceptable conclusions rather than blocklisting `failure`. The
          # blocklist form let `cancelled` and any future conclusion through, greening the
          # gate on a job that never produced a result.
          #
          # `skipped` is acceptable only on a pull_request, where it is the deliberate
          # maintainer/draft bypass. In the merge queue nothing may be skipped: a skipped
          # lane there means the merged commit went untested, which is the one thing the
          # queue exists to prevent.
          failed=0
          while read -r job result; do
            case "$result" in
              success)
                echo "  ok       ${job}"
                ;;
              skipped)
                if [[ "$EVENT_NAME" == "merge_group" ]]; then
                  echo "::error::${job} was skipped in the merge queue; every lane must run on the merged commit"
                  failed=1
                else
                  echo "  skipped  ${job}"
                fi
                ;;
              *)
                echo "::error::${job}: ${result}"
                failed=1
                ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<<"$RESULTS")

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed"
