# Vendored copy of libp2p-quic 0.14.0 (crates.io). See PATCH.md.
# This manifest follows the upstream Cargo.toml.orig layout, with the
# rust-libp2p workspace inherits replaced by the registry versions from the
# published manifest, so that the crate builds outside that workspace.
[package]
name = "libp2p-quic"
version = "0.14.0"
authors = ["Parity Technologies <admin@parity.io>"]
edition = "2024"
rust-version = "1.88.0"
description = "TLS based QUIC transport implementation for libp2p"
repository = "https://github.com/libp2p/rust-libp2p"
license = "MIT"

[dependencies]
futures = "0.3"
futures-timer = "3.0"
if-watch = "3.2"
libp2p-core = "0.44.0"
libp2p-tls = "0.7.0"
libp2p-identity = "0.3.0"
quinn = { version = "0.11", default-features = false, features = ["rustls-aws-lc-rs", "futures-io"] }
quinn-proto = { version = "0.11", default-features = false, features = ["bloom", "log", "ring"] }
rand = "0.10"
thiserror = "2"
tokio = { version = "1.53", default-features = false, features = ["net", "rt", "time"], optional = true }
tracing = "0.1"
socket2 = "0.6"
ring = "0.17"

[features]
tokio = ["dep:tokio", "if-watch/tokio", "quinn/runtime-tokio"]

# Passing arguments to the docsrs builder in order to properly document cfg's.
# More information: https://docs.rs/about/builds#cross-compiling
[package.metadata.docs.rs]
all-features = true

# The upstream `stream_compliance` test and its `libp2p-muxer-test-harness`
# dev-dependency are dropped: the harness is not published on crates.io.
[dev-dependencies]
libp2p-identity = { version = "0.3.0", features = ["rand"] }
libp2p-noise = "0.47.0"
libp2p-tcp = { version = "0.45.0", features = ["tokio"] }
libp2p-yamux = "0.48.0"
quickcheck = "1"
tokio = { version = "1.53", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.clippy]
dbg_macro = "warn"
manual_let_else = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"
type_complexity = "allow"
pedantic = { level = "allow", priority = -1 }

[lints.rust]
unreachable_pub = "warn"
