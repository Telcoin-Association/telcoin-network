[package]
name = "telcoin-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description.workspace = true
exclude.workspace = true

[dependencies]
telcoin-network-cli = { workspace = true }
tn-node = { workspace = true }

[features]
# Adiri-testnet build. Propagates the `adiri` feature through the whole node graph so the
# testnet-only fork logic (`tn_types::forks`, the ConsensusRegistry fork, `ADIRI_DUP_BATCH_EPOCH`)
# is actually compiled into the binary. Enabled for the `docker-adiri` image via a Docker build arg;
# default/mainnet builds omit it. See `tn_types::forks::CONSENSUS_REGISTRY_FORK_EPOCH`.
adiri = ["telcoin-network-cli/adiri", "tn-node/adiri"]
# Serve JavaScript tracers in `debug_trace*` (geth's custom tracers). Off by default: it compiles
# the boa JavaScript engine into the node. See crates/tn-reth/js-tracer.md.
js-tracer = ["tn-node/js-tracer"]
# Run the reth execution database on the tn-lmdb engine instead of MDBX. Off by default.
# MDBX stays compiled either way. See crates/tn-reth/README.md, "Database backend".
tn-lmdb = ["telcoin-network-cli/tn-lmdb", "tn-node/tn-lmdb"]

# Faucet build (devnet). Propagates `faucet` down to `tn-reth`, the only crate with faucet-gated
# code (the unrestricted `mint` precompile used by faucets), through `telcoin-network-cli` so the
# `--version` "Build Features" line lists it. Enabled for the `docker-devnet` image via a Docker
# build arg; default/mainnet builds omit it. `adiri` already implies faucet, so this is only
# needed for a faucet-without-adiri build. The faucet e2e test (`make test-faucet`) builds the
# e2e-tests crate with its own `faucet` feature, not this one.
faucet = ["telcoin-network-cli/faucet", "tn-node/faucet"]

[lints]
workspace = true
