# HorizontalPodAutoscaler driven by two of the gateway's gauges: requests in
# flight (tn_worker_gateway_inflight_requests, read load) and requests held
# on the worker cap (tn_worker_gateway_upstream_inflight, submission load).
# The HPA scales to the larger of the two results. A worker-bound request
# over WORKER_GATEWAY_MAX_UPSTREAM_INFLIGHT (45 in deployment.yaml) is
# refused at once, not queued, so neither gauge averages above 45 under
# submission load alone; the worker-slot target (30) sits below that cap.
#
# The Pods custom metrics below require prometheus-adapter (or an equivalent
# custom.metrics.k8s.io provider) to surface both gauges on the custom
# metrics API as per-pod metrics. See ../README.md for a sample
# prometheus-adapter rules snippet.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-gateway
  labels:
    app: worker-gateway
    app.kubernetes.io/name: worker-gateway
    app.kubernetes.io/part-of: telcoin-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: tn_worker_gateway_inflight_requests
        target:
          type: AverageValue
          averageValue: "50"
    - type: Pods
      pods:
        metric:
          name: tn_worker_gateway_upstream_inflight
        target:
          type: AverageValue
          averageValue: "30"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
