[package]
name = "tn-worker-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Stateless reverse proxy in front of Telcoin Network worker JSON-RPC."

[[bin]]
name = "worker-gateway"
path = "src/main.rs"

[dependencies]
# cli + runtime
clap = { workspace = true, features = ["derive", "env"] }
eyre = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
    "time",
    "sync",
    "signal",
    "macros",
    "io-util",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "std"] }

# http server + client
axum = { workspace = true, features = ["json", "tokio", "http1"] }
hyper = { workspace = true }
hyper-util = { workspace = true }
# the workspace `reqwest` has no TLS backend; rustls is required for an `https://`
# --redirect-queries url and is already in the dependency graph (node-record-api enables
# the same feature), so this adds no new crate
reqwest = { workspace = true, features = ["stream", "rustls-tls-native-roots"] }
# the native root store reqwest loads, checked at startup so an `https` upstream
# on a host without CA certificates fails there instead of on every call; the
# same version reqwest already pulls in, so this adds no new crate
rustls-native-certs = { version = "0.8.3" }
tower-http = { workspace = true }

# metrics
metrics = { workspace = true }

# config + serde
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
humantime = { workspace = true }

# telcoin
tn-config = { workspace = true }
tn-metrics = { workspace = true }
tn-types = { workspace = true }

# `TCP_USER_TIMEOUT` on accepted connections (see `server::set_tcp_user_timeout`);
# the socket option is Linux-family only, so the dependency is too.
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
socket2 = { workspace = true }

[dev-dependencies]
# `TxEip7702` for the screen tests' disallowed-type fixture; every other
# transaction type the tests build comes through `tn-types` re-exports.
alloy = { workspace = true }
tempfile = { workspace = true }
# test certificate authority, server and client certificates for the TLS
# upstream tests, and the TLS mock upstream that serves them; both versions are
# already in the lockfile, and `ring` keeps the build on reqwest's provider
rcgen = { version = "0.13.2" }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }

[lints]
workspace = true
