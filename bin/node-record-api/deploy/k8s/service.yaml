# ClusterIP Service fronting the node-record API pod.
# Exposes both the API port and the (cluster-internal) metrics port.
apiVersion: v1
kind: Service
metadata:
  name: node-record-api
  labels:
    app: node-record-api
    app.kubernetes.io/name: node-record-api
    app.kubernetes.io/part-of: telcoin-network
spec:
  type: ClusterIP
  selector:
    app: node-record-api
  ports:
    - name: api
      port: 8080
      targetPort: api
    - name: metrics
      port: 9100
      targetPort: metrics
