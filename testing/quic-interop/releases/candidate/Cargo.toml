[package]
name = "tn-quic-candidate"
version = "0.14.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
default = ["candidate"]
candidate = []

[lib]
path = "../../src/candidate.rs"

[[bin]]
name = "quic-interop"
path = "../../src/main.rs"

[[bin]]
name = "quic-initial"
path = "../../src/initial.rs"

[dependencies]
bytes = "1"
futures = "0.3"
libp2p = { version = "=0.57.0", default-features = false, features = ["quic", "tokio", "ed25519"] }
libp2p-quic = { version = "=0.14.0", features = ["tokio"] }
libp2p-tls = "=0.7.0"
quinn = { version = "=0.11.9", default-features = false, features = ["rustls-aws-lc-rs", "runtime-tokio", "futures-io"] }
quinn-proto = { version = "=0.11.18", default-features = false, features = ["bloom", "log", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "sync"] }

[patch.crates-io]
libp2p-quic = { path = "../../../../patches/libp2p-quic" }
