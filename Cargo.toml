[workspace]
members = [
    # common
    "bin/telcoin-network",
    "bin/worker-gateway",
    "bin/node-record-api",
    "crates/config",
    "crates/engine",
    "crates/exex",
    "crates/node",
    "crates/storage",
    "crates/test-utils",
    "crates/test-utils-committee",
    "crates/tn-utils",
    "crates/types",
    "crates/network-types",
    "crates/network-libp2p",
    "crates/node-record",
    "crates/kad-client",
    "crates/state-sync",
    "crates/tn-metrics",
    "crates/tn-lmdb",
    "crates/tn-lmdb-bench",
    "crates/tn-lmdb-reth",
    "crates/tn-reth",
    "crates/e2e-tests",
    "crates/telcoin-network-cli",

    # consensus
    "crates/consensus/executor",
    "crates/consensus/primary",
    "crates/consensus/worker",

    # examples
    "examples/exex-indexer",
    "examples/exex-lifecycle",

    # execution
    "crates/batch-builder",
    "crates/batch-validator",
    "crates/execution/tn-rpc",
]
# Carried crate patches are wired in through `[patch.crates-io]` below and kept out of
# the workspace so that upstream code is not held to the house lints. Each patch has a PATCH.md
# maintenance record.
#
# vendor/reth is TN's copy of reth: a nested workspace with reth's own manifest settings and
# lints, reached through the path dependencies below.
exclude = [
    "patches/libp2p-quic",
    "patches/libp2p-connection-limits",
    "patches/quinn-proto",
    "patches/libp2p-gossipsub",
    "patches/revm-inspectors",
    "vendor/reth",
]

# Explicitly set the resolver to version 2, which is the default for packages with edition >= 2021
# https://doc.rust-lang.org/edition-guide/rust-2021/default-cargo-resolver.html
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
# To bump nightly: edit `rust-nightly`
# To bump stable: edit `rust-toolchain.toml` (and align with `Cargo.toml`'s `rust-version` and `etc/Dockerfile`'s base image tag).
rust-version = "1.94" # see note above
license = "MIT OR Apache-2.0"
homepage = "https://telcoin.network"
repository = "https://github.com/telcoin/telcoin-network"
authors = [
    "Grant Kee <grant@telcoin.org>",
    "Steve Stanfield <steve@telcoin.org>",
    "Markus Osterlund <markus@telcoin.org>",
    "Telcoin Association <devs@telcoin.org>",
]
description = "Telcoin Network protocol."
exclude = [".github/"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 } # includes unused_crate_dependencies

[workspace.lints.rustdoc]
all = "warn"

[workspace.dependencies]
# misc
clap = "4"
eyre = "0.6"
futures = "0.3"
tokio = { version = "1.44", default-features = false }
tracing = "0.1.0"
tracing-subscriber = { version = "0.3.20", default-features = false }
metrics = "0.24"                                       # Must stay in sync with reth's `metrics` version - a mismatch silently splits the global recorder
metrics-exporter-prometheus = { version = "0.18", default-features = false }
metrics-process = "2.4"
metrics-util = "0.20"
serde_json = "1.0.94"
humantime-serde = "1.1"
fdlimit = "0.3.0"
snap = "1.1.1"
rayon = "1.7"
libc = "0.2"

# crypto
secp256k1 = { version = "0.31", default-features = false, features = [
    "global-context",
    "rand",
    "recovery",
] }

rpassword = "7.4.0"
# clears passphrases and other secret buffers on drop
zeroize = "1.8.2"

# execution
#
# reth is vendored: the crates below are TN's copy of reth under vendor/reth (pinned in
# vendor/reth/tn/upstream.toml, v1.11.4 today), a nested
# cargo workspace kept out of this one (see `exclude`). vendor/reth/README.md covers layout,
# upstream sync and the ledger of TN changes; vendor/reth/tn/crates.txt lists what is carried.
#
# TN depends on reth's individual crates, never the `reth` umbrella crate: the umbrella only
# re-exports them, and it pulls reth's CLI (`reth-ethereum-cli`, `reth-cli-commands`) into the
# graph. tn-reth's manifest enables the umbrella's default features (keccak-cache-global,
# asm-keccak, min-debug-logs) on the crates they forward to. jemalloc is left out because no TN
# binary installs it as the global allocator, and otlp/otlp-logs because they only fed reth's own
# OTLP exporters, which TN does not use. js-tracer is opt-in: tn-reth's `js-tracer` feature,
# forwarded by tn-node and the telcoin-network binary (crates/tn-reth/js-tracer.md).
#
# RocksDB is not part of TN in any configuration: the vendored reth has its RocksDB backend,
# `rocksdb`/`edge` features and the `rocksdb` crate removed (vendor/reth CHANGES.md TN-0014),
# and etc/rocksdb-gate.sh fails if a rocksdb package ever enters Cargo.lock again.
#
# TN's reth database runs on the tn-lmdb engine (`tn-lmdb-reth`, which also needs reth-db-api,
# reth-storage-errors and reth-trie-common). The off-by-default `mdbx` feature on tn-reth /
# tn-node / telcoin-network-cli / telcoin-network selects MDBX, the legacy backend, instead; MDBX
# stays compiled either way (the default build migrates an MDBX database at its first open).
reth-primitives-traits = { path = "vendor/reth/crates/primitives-traits" }
reth-chainspec = { path = "vendor/reth/crates/chainspec" }
reth-chain-state = { path = "vendor/reth/crates/chain-state" }
reth-db = { path = "vendor/reth/crates/storage/db" }
reth-db-api = { path = "vendor/reth/crates/storage/db-api" }
reth-db-common = { path = "vendor/reth/crates/storage/db-common" }
reth-engine-primitives = { path = "vendor/reth/crates/engine/primitives" }
# Without `std`, as every reth crate takes it: tn-reth only names its payload types.
reth-ethereum-engine-primitives = { path = "vendor/reth/crates/ethereum/engine-primitives", default-features = false }
reth-ethereum-primitives = { path = "vendor/reth/crates/ethereum/primitives" }
reth-evm-ethereum = { path = "vendor/reth/crates/ethereum/evm" }
reth-network-api = { path = "vendor/reth/crates/net/network-api" }
reth-network-peers = { path = "vendor/reth/crates/net/peers" }
reth-evm = { path = "vendor/reth/crates/evm/evm" }
reth-execution-types = { path = "vendor/reth/crates/evm/execution-types" }
# `portable` is one of the `reth` umbrella's default features (`reth-revm/portable`);
# unification applies it to every reth crate's copy of reth-revm.
reth-revm = { path = "vendor/reth/crates/revm", features = ["portable"] }
reth-rpc = { path = "vendor/reth/crates/rpc/rpc" }
reth-rpc-api = { path = "vendor/reth/crates/rpc/rpc-api" }
reth-rpc-builder = { path = "vendor/reth/crates/rpc/rpc-builder" }
reth-rpc-eth-api = { path = "vendor/reth/crates/rpc/rpc-eth-api" }
reth-rpc-eth-types = { path = "vendor/reth/crates/rpc/rpc-eth-types" }
reth-tracing = { path = "vendor/reth/crates/tracing" }
reth-provider = { path = "vendor/reth/crates/storage/provider" }
reth-storage-errors = { path = "vendor/reth/crates/storage/errors" }
reth-prune-types = { path = "vendor/reth/crates/prune/types" }
reth-stages-types = { path = "vendor/reth/crates/stages/types" }
reth-trie = { path = "vendor/reth/crates/trie/trie" }
reth-trie-common = { path = "vendor/reth/crates/trie/common" }
reth-trie-db = { path = "vendor/reth/crates/trie/db" }
reth-trie-sparse = { path = "vendor/reth/crates/trie/sparse" }
reth-tasks = { path = "vendor/reth/crates/tasks" }
reth-tokio-util = { path = "vendor/reth/crates/tokio-util" }
reth-transaction-pool = { path = "vendor/reth/crates/transaction-pool" }
reth-consensus = { path = "vendor/reth/crates/consensus/consensus" }
reth-node-core = { path = "vendor/reth/crates/node/core" }
reth-node-types = { path = "vendor/reth/crates/node/types" }
reth-payload-primitives = { path = "vendor/reth/crates/payload/primitives" }
reth-eth-wire-types = { path = "vendor/reth/crates/net/eth-wire-types" }
reth-cli-util = { path = "vendor/reth/crates/cli/util" }
reth-errors = { path = "vendor/reth/crates/errors" }
reth-libmdbx = { path = "vendor/reth/crates/storage/libmdbx-rs" }
reth-metrics = { path = "vendor/reth/crates/metrics" }

# eth
# `rand` gives alloy's maps (`AddressMap`, `B256Map`, ...) a randomly seeded hasher, which resists
# hash flooding, and provides `Address::random*`. reth-network-types used to enable it; TN now
# asks for it itself (vendor/reth CHANGES.md TN-0031).
alloy = { version = "1.6.3", features = ["full", "rand"] }
alloy-rlp = "0.3.13"
alloy-evm = { version = "0.27.2" }
# Same requirement as vendor/reth/Cargo.toml; tn-reth names it only to set features.
revm = { version = "34.0.0", default-features = false }
# Same requirement and features as reth-network-api's (vendor/reth); tn-reth names its secp256k1.
enr = { version = "0.13", default-features = false, features = ["rust-secp256k1"] }

tn-batch-validator = { path = "crates/batch-validator" }
tn-engine = { path = "crates/engine" }
tn-exex = { path = "crates/exex" }

# batch maker
tn-batch-builder = { path = "crates/batch-builder" }
futures-util = "0.3.25"
jsonrpsee = { version = "0.26.0" }
jsonrpsee-types = { version = "0.26.0" }
assert_matches = { version = "1.5.0" }

# common
tn-types = { path = "./crates/types" }
tn-metrics = { path = "./crates/tn-metrics" }
tn-reth = { path = "./crates/tn-reth" }
tn-lmdb = { path = "./crates/tn-lmdb" }
tn-lmdb-reth = { path = "./crates/tn-lmdb-reth" }
tn-node = { path = "./crates/node" }
tn-config = { path = "./crates/config" }
tn-network-libp2p = { path = "./crates/network-libp2p" }
tn-node-record = { path = "./crates/node-record" }
tn-kad-client = { path = "./crates/kad-client" }
tn-network-types = { path = "./crates/network-types" }
tn-rpc = { path = "./crates/execution/tn-rpc" }
state-sync = { path = "./crates/state-sync" }
tn-utils = { path = "./crates/tn-utils" }
telcoin-network-cli = { path = "./crates/telcoin-network-cli" }

# consensus
tn-executor = { path = "./crates/consensus/executor" }
tn-worker = { path = "./crates/consensus/worker" }
tn-storage = { path = "./crates/storage" }
tn-primary = { path = "./crates/consensus/primary" }
tn-test-utils = { path = "./crates/test-utils" }
tn-test-utils-committee = { path = "./crates/test-utils-committee" }

# misc
match_opt = "0.1.2"
memmap2 = "0.9"
serde = { version = "^1.0", features = ["derive", "rc"] }
serde_repr = "0.1"
rand = "0.9"
rand_chacha = "0.9"
thiserror = "1.0.50"
tempfile = "3.3.0"
bcs = "0.1.4"
bincode = "1.3.3"
proptest = "1.5.0"
proptest-derive = "0.4"
serde-reflection = "0.3.6"
indexmap = { version = "2.5.0", features = ["serde"] }
once_cell = "1.18.0"
prometheus = { version = "0.13.4", default-features = false }
tonic = { version = "0.13" }
async-trait = "0.1.61"
arc-swap = "1"
foldhash = "0.2"
# tn-reth's cross-block execution cache, on the features alloy-primitives already builds it with:
# `stats` would pull `typeid` and `std` would name `rapidhash` in the lockfile. Pinned exactly:
# the cache's soundness rests on 0.1.8 internals (env/exec_cache.rs), re-audit before any bump.
fixed-cache = { version = "=0.1.8", default-features = false, features = ["alloc"] }
dashmap = "6.0.1"
parking_lot = "0.12.3"
scopeguard = "1.1"
uuid = { version = "1.1.2", features = ["v4", "fast-rng"] }
quinn-proto = "0.11.8"
derive_builder = "0.12.0"
roaring = "0.10.1"
serde_with = { version = "2.1.0", features = ["hex"] }
ouroboros = "0.17"
proc-macro2 = "1.0.47"
uint = "0.10"
cfg-if = "1.0.0"
lru = "0.16"
tokio-stream = { version = "0.1.14", features = ["sync", "net"] }
serde_yaml = "0.8.26"
byteorder = "1.4.3"
rustversion = "1.0.9"
bytes = "1.4.0"
humantime = "2.1.0"
blst = "0.3.14"
hex = "0.4.3"
dirs-next = "2.0.0"
escargot = "0.5"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
] }
# http edge servers (bin/worker-gateway, bin/node-record-api)
axum = { version = "0.8.6", default-features = false }
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = [
    "http1",
    "server-graceful",
    "service",
    "tokio",
] }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false, features = [
    "timeout",
    "cors",
] }
socket2 = { version = "0.6", default-features = false, features = ["all"] }
const-str = "0.5.6"
opentelemetry = { version = "0.31.0", default-features = false }
opentelemetry_sdk = { version = "0.31.0", default-features = false }
opentelemetry-otlp = "0.31.0"
opentelemetry-stdout = "0.31.0"
opentelemetry-semantic-conventions = "0.31.0"
tracing-opentelemetry = "0.32"
# healthcheck
http = { version = "1.3.1" }
backoff = { version = "0.4.0", features = [
    "futures",
    "futures-core",
    "pin-project-lite",
    "tokio",
    "tokio_1",
] }

libp2p = { version = "0.57.0" }
url = { version = "2.5", features = ["serde"] }
bs58 = { version = "0.5.1" }
blake3 = { version = "1.8.2" }

[patch.crates-io]
quinn-proto = { path = "patches/quinn-proto" }
# QUIC listener address validation (Retry) and bounded incoming queues.
# See patches/libp2p-quic/PATCH.md for the maintenance record.
libp2p-quic = { path = "patches/libp2p-quic" }
# Release per-peer connection accounting after the last connection closes.
# See patches/libp2p-connection-limits/PATCH.md for provenance and retirement criteria.
libp2p-connection-limits = { path = "patches/libp2p-connection-limits" }
# Expire unanswered IWANT promises on every heartbeat, not only while peer scoring is active.
# See patches/libp2p-gossipsub/PATCH.md for provenance and retirement criteria.
libp2p-gossipsub = { path = "patches/libp2p-gossipsub" }
# JavaScript tracers: Boa's recursion limit lowered to 128 so a recursive accessor cannot overflow
# a blocking thread's stack (upstream #548). See patches/revm-inspectors/PATCH.md.
revm-inspectors = { path = "patches/revm-inspectors" }
