[book]
title = "Telcoin Network"
description = "Documentation for Telcoin Network, an EVM-compatible public blockchain secured by GSMA member Mobile Network Operators using proof of stake consensus."
authors = ["Telcoin Association"]
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
git-repository-url = "https://github.com/Telcoin-Association/telcoin-network"
edit-url-template = "https://github.com/Telcoin-Association/telcoin-network/edit/main/docs/src/{path}"
# Served at the root of docs.telcoin.network (the GitHub Pages custom domain).
# Only the 404 page's <base href> depends on this; the docs workflow overrides
# it per version build and must agree (SITE_ROOT in .github/workflows/docs.yaml).
site-url = "/"

# Theme (docs/theme/): light + navy only; the header switch offers Light/System/Dark.
# "navy" must stay the dark theme id — book.js keys highlight-css switching on it.
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true
# The right rail ("On this page", tn-custom.js) replaces in-sidebar heading nav.
sidebar-header-nav = false
additional-css = ["theme/tn-custom.css"]
additional-js = ["theme/tn-custom.js"]

[output.html.fold]
enable = true
level = 0

# rpc-methods/ was reorganized by namespace; old page URLs redirect to the new ones.
# Targets are relative to the old page so they also resolve under the /<tag>/ builds.
[output.html.redirect]
"/rpc-methods/eth_accounts.html" = "eth/eth_accounts.html"
"/rpc-methods/eth_blocknumber.html" = "eth/eth_blocknumber.html"
